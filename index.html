<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />
<title>Painel Cordeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />
<style>
/* ---------- Cores e tipografia ----------
   Marca: azul-marinho e âmbar (a faixa tracejada de estrada).
   Claro: papel azulado, tinta marinho. Escuro: asfalto. O âmbar é só sinal. */
:root {
  --fundo:#F4F0E8; --superficie:#FFFDF8; --superficie-2:#F6F1E6; --tinta:#0F2A43; --tinta-2:#5B6572; --linha:#E6DFD0;
  --ambar:#E8A33D; --ambar-texto:#7C5008; --asfalto:#12283C; --asfalto-linha:rgba(255,255,255,.30);
  --azul:#1F5AA0; --azul-fundo:#E4EDF8;
  --erro:#A92B1F; --erro-fundo:#F9E6E2; --alerta:#A04F0B; --alerta-fundo:#FBEFD9; --ok:#1B6E44; --ok-fundo:#E4F1E7; --barra:#0F2A43;
  --lateral:#0F2A43; --lateral-tinta:#D5DEE8; --sombra:0 1px 1px rgba(15,42,67,.04);
  --foco:#1F5AA0;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fundo:#07121D; --superficie:#0E2031; --superficie-2:#0A1927; --tinta:#E8EEF5; --tinta-2:#9AAEC2; --linha:#1E3850;
    --ambar:#F0AE45; --ambar-texto:#F0AE45; --asfalto:#040B12; --asfalto-linha:rgba(255,255,255,.22);
    --azul:#86B8EE; --azul-fundo:#12304D;
    --erro:#FF9A8C; --erro-fundo:#3A1A18; --alerta:#F0AE45; --alerta-fundo:#3A2A0E; --ok:#5CCB93; --ok-fundo:#10332A;
    --lateral:#0A1827; --lateral-tinta:#9AAEC2; --sombra:none; --foco:#86B8EE; --barra:#86B8EE;
  }
}
:root[data-tema="escuro"] {
  --fundo:#07121D; --superficie:#0E2031; --superficie-2:#0A1927; --tinta:#E8EEF5; --tinta-2:#9AAEC2; --linha:#1E3850;
  --ambar:#F0AE45; --ambar-texto:#F0AE45; --asfalto:#040B12; --asfalto-linha:rgba(255,255,255,.22);
  --azul:#86B8EE; --azul-fundo:#12304D;
  --erro:#FF9A8C; --erro-fundo:#3A1A18; --alerta:#F0AE45; --alerta-fundo:#3A2A0E; --ok:#5CCB93; --ok-fundo:#10332A;
  --lateral:#0A1827; --lateral-tinta:#9AAEC2; --sombra:none; --foco:#86B8EE; --barra:#86B8EE;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--fundo); color:var(--tinta); font-family:var(--f); font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums; }
[hidden] { display:none !important; }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--foco); outline-offset:2px; border-radius:6px; }
h1, h2, h3 { margin:0; }
.sub { color:var(--tinta-2); font-size:13px; }
.larga { font-stretch:112%; }

/* ---------- Estrutura ---------- */
.shell { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
.lateral { background:var(--lateral); color:#F2F6FA; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:22px 14px 0; }
.marca { padding:0 8px 26px; display:flex; align-items:center; gap:11px; }
.marca img { border-radius:10px; flex:none; }
.marca b { display:block; font-size:19px; font-weight:900; font-stretch:112%; letter-spacing:.5px; line-height:1; }
.marca small { display:block; margin-top:5px; font-size:10px; letter-spacing:3.2px; color:var(--lateral-tinta); }
.faixa { height:4px; width:56px; margin-top:12px; background:repeating-linear-gradient(90deg,var(--ambar) 0 12px,transparent 12px 20px); border-radius:2px; }
#abas { display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
#abas button { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; color:var(--lateral-tinta); padding:10px 10px; border-radius:10px; cursor:pointer; font-weight:600; font-size:14.5px; position:relative; }
#abas button svg { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#abas button:hover { background:rgba(255,255,255,.07); color:#fff; }
#abas button[aria-current="page"] { background:var(--ambar); color:#0F2A43; font-weight:800; }

.nome-curto { display:none; }
.lateral-pe { border-top:1px solid rgba(255,255,255,.12); padding:14px 6px 18px; display:flex; flex-direction:column; gap:10px; }
.eu { display:flex; align-items:center; gap:10px; min-width:0; }
.eu .av { background:rgba(255,255,255,.14); color:#fff; }
.eu div { min-width:0; line-height:1.2; }
.eu b { display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.eu span { font-size:12px; color:var(--lateral-tinta); }
.pe-botoes { display:flex; gap:8px; }
.btn-lat { flex:1; background:transparent; border:1px solid rgba(255,255,255,.22); color:#E4ECF4; border-radius:9px; padding:7px 8px; font-size:13px; font-weight:700; cursor:pointer; }
.btn-lat:hover { border-color:var(--ambar); }
.coluna { min-width:0; }
.topo-m { display:none; }
main { max-width:1120px; margin:0 auto; padding:30px 28px 80px; }

/* ---------- Cabeçalho de página ---------- */
.pagina-topo { display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:22px; }
.pagina-topo h1 { font-size:clamp(26px,3.2vw,36px); font-weight:850; font-stretch:114%; letter-spacing:-.6px; line-height:1.08; }
.pagina-topo p { margin:6px 0 0; color:var(--tinta-2); font-size:14.5px; max-width:62ch; }
.acoes { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

/* ---------- Controles ---------- */
.seg { max-width:100%; overflow-x:auto; display:inline-flex; background:var(--superficie); border:1px solid var(--linha); border-radius:11px; padding:3px; gap:2px; flex-wrap:wrap; }
.seg button { white-space:nowrap; flex:none; border:0; background:none; padding:7px 13px; border-radius:8px; font-weight:700; font-size:13.5px; color:var(--tinta-2); cursor:pointer; }
.seg button:hover { color:var(--tinta); }
.seg button[aria-pressed="true"] { background:var(--tinta); color:var(--superficie); }
label.c { display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:700; color:var(--tinta-2); }
label.c input, label.c select { font-weight:500; color:var(--tinta); }
input, select, textarea { padding:9px 11px; border:1px solid var(--linha); border-radius:9px; background:var(--superficie); font-size:14.5px; min-height:40px; }
input:disabled { background:transparent; border-color:transparent; padding-left:0; }
input::placeholder { color:var(--tinta-2); opacity:.7; }
.btn { cursor:pointer; font-weight:750; border-radius:10px; border:1px solid var(--linha); padding:9px 15px; background:var(--superficie); font-size:14px; min-height:40px; transition:border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color:var(--tinta); }
.btn.main { background:var(--lateral); color:#fff; border-color:var(--lateral); }
.btn.main:hover:not(:disabled) { border-color:var(--ambar); }
.btn.ambar { background:var(--ambar); color:#0F2A43; border-color:var(--ambar); }
.btn.mini { padding:4px 11px; font-size:13px; min-height:32px; }
.btn:disabled { opacity:.55; cursor:default; }
.filtros { display:flex; gap:12px 16px; flex-wrap:wrap; align-items:flex-end; }
.busca-in { position:relative; display:block; }
.busca-in svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:17px; height:17px; stroke:var(--tinta-2); fill:none; stroke-width:2; stroke-linecap:round; }
.busca-in input { padding-left:36px; min-width:260px; width:100%; }

/* ---------- Superfícies ---------- */
.cartao { background:var(--superficie); border:1px solid var(--linha); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:var(--sombra); }
.cartao h2 { font-size:17px; font-weight:800; font-stretch:106%; letter-spacing:-.2px; }
.cartao-topo { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.aviso { padding:11px 14px; border-radius:11px; background:var(--alerta-fundo); color:var(--alerta); font-size:14px; margin-bottom:14px; font-weight:600; }
.aviso.erro { background:var(--erro-fundo); color:var(--erro); }
.vazio { padding:26px 6px; color:var(--tinta-2); text-align:center; max-width:52ch; margin:0 auto; }
.vazio b { display:block; color:var(--tinta); font-size:16px; margin-bottom:4px; }

/* ---------- Produtividade: resumo ---------- */
.cards { display:grid; grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:16px; }
.total { background:var(--tinta); color:var(--superficie); border-radius:16px; padding:20px 22px; display:flex; flex-direction:column; gap:12px; }
.total h2 { font-size:14px; font-weight:700; opacity:.82; font-stretch:100%; letter-spacing:0; }
.total-n { font-size:clamp(46px,6vw,68px); font-weight:900; font-stretch:122%; line-height:.95; letter-spacing:-2px; }
.divide { display:flex; height:10px; border-radius:6px; overflow:hidden; gap:3px; }
.divide i { display:block; min-width:4px; }
.divide .d-ch { background:#86B8EE; } .divide .d-at { background:var(--ambar); }
.legenda { display:flex; gap:18px; font-size:13.5px; flex-wrap:wrap; }
.legenda span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px; vertical-align:-1px; }
.legenda .l-ch::before { background:#86B8EE; } .legenda .l-at::before { background:var(--ambar); }
.legenda b { font-weight:800; }
.prob { justify-content:space-between; text-align:left; border:1px solid var(--linha); background:var(--superficie); border-radius:16px; padding:18px 18px 14px; cursor:pointer; display:flex; flex-direction:column; gap:3px; box-shadow:var(--sombra); transition:border-color .15s, transform .15s; }
.prob:hover { border-color:currentColor; }
.prob b { font-size:38px; font-weight:850; font-stretch:114%; line-height:1; letter-spacing:-1px; }
.prob span { font-size:14.5px; font-weight:700; color:var(--tinta); }
.prob small { font-size:12.5px; color:var(--tinta-2); margin-top:4px; }
.prob.zero b { color:var(--tinta-2); font-weight:700; }
.prob.erro { color:var(--erro); } .prob.diverg { color:var(--alerta); } .prob.rep { color:var(--azul); }
.prob.zero { color:var(--tinta-2); }

/* ---------- Produtividade: pistas (ranking) ---------- */
.pistas { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.pista { display:grid; grid-template-columns:26px 38px minmax(0,1fr) 92px; gap:4px 14px; align-items:center; padding:13px 0; border-top:1px solid var(--linha); }
.pista:first-child { border-top:0; }
.pos { color:var(--tinta-2); font-weight:700; text-align:center; }
.av { width:38px; height:38px; border-radius:50%; background:var(--azul-fundo); color:var(--azul); display:grid; place-items:center; font-weight:800; font-size:13px; letter-spacing:.3px; flex:none; }
.pista-topo { display:flex; gap:4px 12px; align-items:baseline; flex-wrap:wrap; margin-bottom:7px; }
.pista-topo b { font-size:15.5px; font-weight:800; }
.pista-topo .sub { font-size:12.5px; }
.via { position:relative; height:14px; border-radius:7px; background:var(--asfalto); }
.via::before { content:""; position:absolute; left:6px; right:6px; top:50%; height:2px; margin-top:-1px; background:repeating-linear-gradient(90deg,var(--asfalto-linha) 0 9px,transparent 9px 18px); }
.via-fill { position:absolute; left:0; top:0; bottom:0; width:var(--w); background:var(--ambar); border-radius:7px; transform-origin:left center; animation:encher .8s cubic-bezier(.2,.7,.2,1) both; }
.via-fill::after { content:""; position:absolute; left:6px; right:6px; top:50%; height:2px; margin-top:-1px; background:repeating-linear-gradient(90deg,rgba(15,42,67,.45) 0 9px,transparent 9px 18px); }
.meta-marca { position:absolute; top:-5px; bottom:-5px; width:3px; margin-left:-1.5px; background:var(--tinta); border-radius:2px; }
.pista-n { text-align:right; line-height:1.1; }
.pista-n b { font-size:25px; font-weight:850; font-stretch:112%; letter-spacing:-.5px; }
.pista-n .sub { display:block; font-size:12px; }
.pista-extra { grid-column:3 / 5; display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.pista-extra:empty { display:none; }
.etq { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:12.5px; font-weight:750; white-space:nowrap; }
.etq.erro { background:var(--erro-fundo); color:var(--erro); }
.etq.divergencia { background:var(--alerta-fundo); color:var(--alerta); }
.etq.repetido { background:var(--azul-fundo); color:var(--azul); }
.etq.chegada, .etq.atribuicao, .etq.resolvida, .etq.ok { background:var(--ok-fundo); color:var(--ok); }
.etq.aberta { background:var(--alerta-fundo); color:var(--alerta); }
.etq.prometida { background:var(--azul-fundo); color:var(--azul); }
.etq.sem_resposta { background:var(--erro-fundo); color:var(--erro); }
.etq.neutro { background:var(--superficie-2); color:var(--tinta-2); border:1px solid var(--linha); }
@keyframes encher { from { transform:scaleX(0); } to { transform:scaleX(1); } }
.nota-pistas { margin:12px 0 0; display:flex; gap:8px 20px; flex-wrap:wrap; }

/* ---------- Rotas de hoje ---------- */
.rotas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
.rota-cartao { background:var(--superficie); border:1px solid var(--linha); border-radius:16px; padding:16px 18px; box-shadow:var(--sombra); border-left:5px solid var(--ambar); }
.rota-cartao.feita { border-left-color:var(--ok); }
.rota-cartao h3 { font-size:20px; font-weight:850; font-stretch:112%; letter-spacing:-.3px; display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.rota-cartao h3 svg { width:20px; height:20px; stroke:var(--ambar-texto); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.rota-cartao.feita h3 svg { stroke:var(--ok); }
.rota-pessoa { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--linha); }
.rota-pessoa .av { width:30px; height:30px; font-size:11.5px; }
.rota-pessoa b { font-size:14.5px; }
.rota-pessoa .sub { display:block; font-size:12.5px; }
.resumo-rotas { display:flex; gap:10px 14px; flex-wrap:wrap; margin-bottom:16px; }

/* ---------- Ritmo do dia ---------- */
.ritmo { display:flex; align-items:flex-end; gap:5px; height:150px; padding-top:22px; }
.ritmo > div { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; position:relative; }
.ritmo i { display:block; width:100%; border-radius:5px 5px 2px 2px; background:var(--barra); min-height:3px; }
.ritmo .pico i { background:var(--ambar); }
.ritmo em { font-style:normal; font-size:12px; font-weight:800; position:absolute; top:-1px; }
.ritmo span { font-size:11.5px; color:var(--tinta-2); height:14px; }

/* ---------- Tabelas ---------- */
.rolagem { overflow-x:auto; }
.tabela { width:100%; border-collapse:collapse; font-size:14.5px; }
.tabela th { text-align:left; font-size:12.5px; color:var(--tinta-2); font-weight:750; padding:9px 10px; border-bottom:1px solid var(--linha); white-space:nowrap; position:sticky; top:0; background:var(--superficie); }
.tabela td { padding:11px 10px; border-bottom:1px solid var(--linha); vertical-align:top; }
.tabela td.n, .tabela th.n { text-align:right; }
.tabela tbody tr:hover td { background:var(--superficie-2); }
.tabela tr.vencida td:first-child { box-shadow:inset 3px 0 0 var(--erro); }
.tabela .inativa td:first-child { box-shadow:inset 3px 0 0 var(--ambar); }
a.awb { color:var(--azul); cursor:pointer; font-weight:750; text-decoration:underline; text-underline-offset:3px; }
details.det { margin-top:14px; }
details.det summary { cursor:pointer; font-weight:750; color:var(--azul); padding:6px 0; }

/* ---------- Pacote (linha do tempo) ---------- */
.pacote-busca { display:flex; gap:10px; flex-wrap:wrap; }
.pacote-busca input { flex:1; min-width:240px; font-size:16px; min-height:46px; }
.pacote-busca .btn { min-height:46px; }
.linha-tempo { list-style:none; margin:6px 0 0; padding:0 0 0 8px; position:relative; }
.linha-tempo::before { content:""; position:absolute; left:15px; top:10px; bottom:10px; width:2px; background:var(--linha); }
.linha-tempo li { display:grid; grid-template-columns:16px minmax(0,1fr); gap:14px; padding:10px 0; position:relative; }
.linha-tempo li > i { width:16px; height:16px; border-radius:50%; background:var(--superficie); border:3px solid var(--azul); margin-top:3px; position:relative; z-index:1; }
.linha-tempo li.t-erro > i { border-color:var(--erro); } .linha-tempo li.t-divergencia > i { border-color:var(--ambar); }
.linha-tempo li.t-ok > i { border-color:var(--ok); }
.linha-tempo time { display:block; color:var(--tinta-2); font-size:13px; margin-bottom:3px; }

/* ---------- Toast ---------- */
#toasts { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast { background:var(--tinta); color:var(--superficie); padding:11px 16px; border-radius:11px; font-weight:700; font-size:14px; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); animation:entra .25s ease-out; max-width:340px; }
.toast.erro { background:var(--erro); color:#fff; }
@keyframes entra { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

/* ---------- Esqueleto de carregamento ---------- */
.esq { border-radius:12px; background:linear-gradient(90deg,var(--linha) 0%,var(--superficie-2) 50%,var(--linha) 100%); background-size:200% 100%; animation:brilho 1.3s linear infinite; }
@keyframes brilho { to { background-position:-200% 0; } }

/* ---------- Entrar ---------- */
.entrar { min-height:100vh; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); }
.entrar-marca { background:var(--lateral); color:#F2F6FA; padding:48px 52px; display:flex; flex-direction:column; justify-content:space-between; gap:40px; position:relative; overflow:hidden; }
.entrar-marca b { font-size:clamp(34px,4.6vw,54px); font-weight:900; font-stretch:120%; letter-spacing:-1px; line-height:1; display:block; }
.entrar-marca p { margin:18px 0 0; max-width:34ch; color:var(--lateral-tinta); font-size:17px; }
.estrada { height:18px; background:var(--asfalto); border-radius:9px; position:relative; margin:0 -52px 0 0; }
.estrada::before { content:""; position:absolute; left:14px; right:0; top:50%; height:3px; margin-top:-1.5px; background:repeating-linear-gradient(90deg,var(--ambar) 0 34px,transparent 34px 58px); }
.entrar-form { display:flex; align-items:center; justify-content:center; padding:32px 24px; }
.entrar-form form { width:100%; max-width:380px; display:flex; flex-direction:column; gap:16px; }
.entrar-form h1 { font-size:28px; font-weight:850; font-stretch:112%; letter-spacing:-.5px; }
.entrar-form .btn { min-height:46px; font-size:15px; }
.campo-senha { position:relative; display:flex; }
.campo-senha input { flex:1; padding-right:70px; }
.campo-senha button { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; font-weight:700; font-size:13px; color:var(--azul); cursor:pointer; padding:6px 8px; }


/* ---------- Painel do dia, rotas, fechamento (mockup) ---------- */
.grupo-nav { margin:16px 10px 6px; font-size:11px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:var(--lateral-tinta); opacity:.65; }
.sub-seg { margin-bottom:18px; }
.tiles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; margin-bottom:16px; }
.tile { text-align:left; background:var(--superficie); border:1px solid var(--linha); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; box-shadow:var(--sombra); font:inherit; color:inherit; }
button.tile { cursor:pointer; transition:border-color .15s; }
button.tile:hover { border-color:var(--tinta); }
.tile span { font-size:13.5px; color:var(--tinta-2); }
.tile b { font-size:clamp(30px,3.4vw,40px); font-weight:850; font-stretch:112%; line-height:1.05; letter-spacing:-1px; }
.tile small { font-size:12.5px; color:var(--tinta-2); }
.tile.erro small, .tile.erro b { color:var(--erro); } .tile.alerta small { color:var(--alerta); } .tile.ok small { color:var(--ok); }
.grade2 { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:16px; align-items:start; }
.ritmo.alto { height:230px; padding-top:26px; gap:10px; }

.atencao { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.atencao li > * { display:block; width:100%; text-align:left; border:0; border-radius:10px; padding:11px 14px 11px 30px; position:relative; font:inherit; color:inherit; }
.atencao li > button { cursor:pointer; }
.atencao li > *::before { content:""; position:absolute; left:13px; top:17px; width:8px; height:8px; border-radius:50%; background:currentColor; }
.atencao b { display:block; font-size:14.5px; color:var(--tinta); }
.atencao span { display:block; font-size:12.5px; color:var(--tinta-2); margin-top:1px; }
.atencao li.erro > * { background:var(--erro-fundo); color:var(--erro); }
.atencao li.alerta > * { background:var(--alerta-fundo); color:var(--alerta); }
.atencao li.ok > * { background:var(--ok-fundo); color:var(--ok); }
td.avanco { width:34%; min-width:140px; }
.barra-av { display:block; height:8px; border-radius:5px; background:var(--linha); overflow:hidden; }
.barra-av i { display:block; height:100%; background:var(--barra); border-radius:5px; }
.grade-rotas { display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr); gap:16px; align-items:start; }
.rota-lista { display:flex; flex-direction:column; gap:10px; }
.rota-item { display:flex; justify-content:space-between; align-items:center; gap:10px; text-align:left; width:100%; background:var(--superficie); border:1px solid var(--linha); border-radius:11px; padding:11px 14px; cursor:pointer; font:inherit; color:inherit; }
.rota-item:hover { border-color:var(--tinta-2); }
.rota-item.sel { background:var(--alerta-fundo); border-color:var(--tinta); }
.rota-item b { display:block; font-size:14.5px; } .rota-item small { display:block; font-size:12.5px; color:var(--tinta-2); }
.rota-item em { display:flex; align-items:center; gap:8px; font-style:normal; font-size:12.5px; color:var(--tinta-2); white-space:nowrap; }
.rota-item em svg { width:16px; height:16px; stroke:var(--ambar-texto); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.rota-item em i { font-style:normal; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
.chip { background:var(--alerta-fundo); color:var(--tinta); border-radius:20px; padding:4px 12px; font-size:13px; }
.chip small { color:var(--tinta-2); }

.metricas > div { background:var(--superficie-2); border-radius:10px; padding:12px 14px; }
.metricas span { display:block; font-size:12.5px; color:var(--tinta-2); }
.metricas b { font-size:26px; font-weight:850; font-stretch:110%; letter-spacing:-.5px; }
.texto-fech { width:100%; resize:vertical; font:13.5px/1.5 ui-monospace,Consolas,monospace; background:var(--alerta-fundo); border-color:transparent; }
.em-breve { text-align:left; display:inline-block; margin:14px 0 0; color:var(--tinta); }

<script>
/* ===================== PURAS ===================== */
/* PURAS:INICIO */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function hojeSP(agora) {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(agora || new Date());
  return p; // AAAA-MM-DD
}
function somarDias(iso, n) {
  const [a, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(a, m - 1, d + n));

function seletorPeriodo(estado) {
  const rotulos = [['hoje', 'Hoje'], ['ontem', 'Ontem'], ['7d', '7 dias'], ['30d', '30 dias'], ['mes', 'Este mês'], ['livre', 'Escolher']];
  return `<div class="seg" id="fpSeg" role="group" aria-label="Período">${rotulos.map(([k, n]) => `<button type="button" data-p="${k}" aria-pressed="${estado.tipo === k}">${n}</button>`).join('')}</div>`;
}
function datasLivres(estado) {

    <label class="c">Até<input type="date" id="fpAte" value="${esc(estado.ate)}" /></label></div>`;
}
function ligarFiltroPeriodo(estado, aoMudar) {
  document.querySelectorAll('#fpSeg button').forEach((b) => b.addEventListener('click', () => {
    estado.tipo = b.dataset.p;
    if (estado.tipo !== 'livre') { const p = periodo(estado.tipo, hojeSP()); estado.de = p.de; estado.ate = p.ate; }
    document.querySelectorAll('#fpSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    $('fpLivre').hidden = estado.tipo !== 'livre';
    $('fpDe').value = estado.de; $('fpAte').value = estado.ate;
    aoMudar();
  }));
  const livre = () => { if ($('fpDe').value && $('fpAte').value) { estado.de = $('fpDe').value; estado.ate = $('fpAte').value; if (estado.de > estado.ate) [estado.de, estado.ate] = [estado.ate, estado.de]; aoMudar(); } };
  $('fpDe').addEventListener('change', livre); $('fpAte').addEventListener('change', livre);
}
function novoEstadoPeriodo(tipo) { const p = periodo(tipo, hojeSP()); return { tipo, de: p.de, ate: p.ate }; }
function faixa(est) { return `dia=gte.${eFiltroSeguro(est.de)}&dia=lte.${eFiltroSeguro(est.ate)}`; }

async function carregarMotoristas(silencioso) {

    const [rotas, loc, ev] = await Promise.all([

    if (!rs.includes(E.rotaSel)) E.rotaSel = rs[0];

      const s = hojeDe.get(r), n = locais.filter((l) => l.rota === r).length;

      const r = E.rotaSel, s = hojeDe.get(r), meus = locais.filter((l) => l.rota === r);

      $('mtDet').innerHTML = detalhe();
    }));
  } catch (e) { if (meu === tokenMot && $('mtCorpo') && !silencioso) $('mtCorpo').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }
}

let tokenPro = 0, linhasPro = [];
const ICO_BUSCA = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
function telaProblemas() {

  if ($('prOp')) $('prOp').addEventListener('change', () => { estPro.operador = $('prOp').value; carregarProblemas(); });

}
async function carregarProblemas() {
  const meu = ++tokenPro, corpo = $('prCorpo');
  if (!corpo) return;
  corpo.innerHTML = esqueleto();
  try {
    const op = estPro.operador ? '&operador_id=eq.' + eFiltroSeguro(estPro.operador) : '';
    const r = await lerTudo('/rest/v1/eventos?select=id,ocorreu_em,tipo,awb,operador_id,origem,cidade,rota,motorista,motivo&tipo=in.(' + estPro.tipo2 + ')&' + faixa(estPro) + op + '&order=ocorreu_em.desc', 10);
    if (meu !== tokenPro) return;
    linhasPro = r.itens; linhasPro._completo = r.completo;
    desenharProblemas();
  } catch (e) { if (meu === tokenPro && $('prCorpo')) $('prCorpo').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }

function filtrarProblemas() {
  const q = estPro.busca.trim().toLowerCase();
  if (!q) return linhasPro;
  return linhasPro.filter((e) => [e.awb, e.motorista, e.motivo, e.rota, e.cidade, nomeOperador(e.operador_id)].some((v) => String(v || '').toLowerCase().includes(q)));
}

}

    const awb = eFiltroSeguro($('pkAwb').value.trim());
    const corpo = $('pkCorpo');

// Lista única para todos os aparelhos (app e extensão). O administrador edita aqui ou
// no próprio app/extensão; os demais recebem a lista automaticamente.
function limparLocais(lista) {
  const vistos = new Set(), out = [];
  for (const x of lista) {
    const termo = String(x.termo || '').trim().slice(0, 80), rota = String(x.rota || '').trim().slice(0, 60), cidade = String(x.cidade || '').trim().slice(0, 60);
    if (!termo || !rota) continue;
    const k = (termo + '|' + cidade).toLowerCase();
    if (vistos.has(k)) continue;
    vistos.add(k); out.push({ termo, rota, cidade });
  }
  return out;
}
async function telaLocais() {
  const editavel = E.perfil.papel === 'dono';
  $('conteudo').innerHTML = cabecalho('Locais por rota', 'Bairros, ruas ou trechos (como BR-101 ou Centro) que pertencem a cada rota.') + `<div id="lcRaiz">${esqueleto()}</div>`;
  let lista = [], quando = null, quem = null;
  try {
    const r = await api('GET', '/rest/v1/cadastros?select=valor,atualizado_em,atualizado_por&chave=eq.locais');
    if (r && r[0] && Array.isArray(r[0].valor)) lista = r[0].valor;
    if (r && r[0]) { quando = r[0].atualizado_em; quem = r[0].atualizado_por; }
  } catch (e) { $('lcRaiz').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; return; }
  lista = [...lista].sort((a, b) => String(a.rota).localeCompare(String(b.rota), 'pt-BR', { numeric: true }) || String(a.termo).localeCompare(String(b.termo), 'pt-BR'));
  const rotas = [...new Set(lista.map((x) => x.rota).filter(Boolean))];
  const linha = (x) => `<tr><td><input class="lcTermo" value="${esc(x.termo)}" aria-label="Local" ${editavel ? '' : 'disabled'} /></td>
    <td><input class="lcRota" list="lcRotas" value="${esc(x.rota)}" aria-label="Rota" ${editavel ? '' : 'disabled'} /></td>
    <td><input class="lcCidade" value="${esc(x.cidade)}" placeholder="Qualquer cidade" aria-label="Cidade" ${editavel ? '' : 'disabled'} /></td>
    ${editavel ? '<td><button class="btn mini lcDel" type="button">Excluir</button></td>' : ''}</tr>`;
  $('lcRaiz').innerHTML = `<div class="cartao">
    <p class="sub" style="margin:0 0 14px">${editavel ? 'Ao salvar, todos os celulares e computadores recebem a lista em poucos minutos.' : 'Só o administrador edita. Você recebe a lista automaticamente.'}
    ${quando ? ' Última alteração em ' + esc(dataHoraBR(quando)) + (quem ? ', por ' + esc(nomeOperador(quem)) : '') + '.' : ' Ainda não há lista publicada.'}</p>
    <datalist id="lcRotas">${rotas.map((r) => `<option value="${esc(r)}">`).join('')}</datalist>
    <div class="rolagem"><table class="tabela"><thead><tr><th>Local</th><th>Rota</th><th>Cidade</th>${editavel ? '<th></th>' : ''}</tr></thead><tbody id="lcCorpo">${lista.map(linha).join('')}</tbody></table></div>
    ${lista.length || editavel ? '' : '<div class="vazio"><b>Nada cadastrado</b>O administrador ainda não publicou locais.</div>'}
    ${editavel ? '<div class="filtros" style="margin-top:14px"><button class="btn" id="lcAdd" type="button">Adicionar local</button><button class="btn ambar" id="lcSalvar" type="button">Salvar para todos</button><span id="lcMsg" class="sub"></span></div>' : ''}</div>`;
  if (!editavel) return;
  const ligarDel = () => document.querySelectorAll('.lcDel').forEach((b) => { b.onclick = () => b.closest('tr').remove(); });
  ligarDel();
  $('lcAdd').addEventListener('click', () => { $('lcCorpo').insertAdjacentHTML('beforeend', linha({ termo: '', rota: '', cidade: '' })); ligarDel(); $('lcCorpo').lastElementChild.querySelector('.lcTermo').focus(); });
  $('lcSalvar').addEventListener('click', async () => {
    const novos = limparLocais([...document.querySelectorAll('#lcCorpo tr')].map((tr) => ({ termo: tr.querySelector('.lcTermo').value, rota: tr.querySelector('.lcRota').value, cidade: tr.querySelector('.lcCidade').value })));
    const botao = $('lcSalvar'); botao.disabled = true;
    try {
      await api('POST', '/rest/v1/cadastros', [{ chave: 'locais', valor: novos, atualizado_em: new Date().toISOString() }], { Prefer: 'resolution=merge-duplicates,return=minimal' });
      $('lcMsg').textContent = novos.length + ' local(is) salvo(s) ✓'; aviso('Lista salva para todos os aparelhos');
    } catch (e) { $('lcMsg').textContent = e.message; aviso(e.message, true); }
    finally { botao.disabled = false; }
  });
}

    const tr = b.closest('tr'), id = tr.dataset.id;
    const dados = { nome: tr.querySelector('.eqNome').value.trim() || 'Sem nome', nome_imile: tr.querySelector('.eqImile').value.trim() || null };
    if (id !== E.sessao.id) { dados.papel = tr.querySelector('.eqPapel').value; dados.ativo = tr.querySelector('.eqAtivo').checked; }
    b.disabled = true;
    try {
      await api('PATCH', '/rest/v1/perfis?id=eq.' + eFiltroSeguro(id), dados, { Prefer: 'return=minimal' });
      E.perfis.set(id, { ...E.perfis.get(id), ...dados });
      b.textContent = 'Salvo ✓'; aviso('Alterações salvas'); setTimeout(() => { b.textContent = 'Salvar'; b.disabled = false; }, 1200);
    } catch (e) { b.disabled = false; aviso(e.message, true); }
  }));
  $('metaSalvar').addEventListener('click', async () => {
    const n = Math.max(0, Math.floor(Number($('metaDia').value) || 0));
    try {
      await api('POST', '/rest/v1/cadastros', [{ chave: 'metas', valor: { pacotes_dia: n }, atualizado_em: new Date().toISOString() }], { Prefer: 'resolution=merge-duplicates,return=minimal' });
      E.meta = { pacotes_dia: n }; $('metaSalvar').textContent = 'Salvo ✓'; aviso(n ? 'Meta salva: ' + n + ' pacotes por dia' : 'Meta desligada'); setTimeout(() => { $('metaSalvar').textContent = 'Salvar meta'; }, 1200);
    } catch (e) { aviso(e.message, true); }
  });
}

aplicarTema(temaGuardado());
$('btnTema').addEventListener('click', ciclarTema);
$('formLogin').addEventListener('submit', (e) => { e.preventDefault(); entrar(); });
$('lgVer').addEventListener('click', () => { const i = $('lgSenha'), ver = i.type === 'password'; i.type = ver ? 'text' : 'password'; $('lgVer').textContent = ver ? 'Ocultar' : 'Mostrar'; });
$('btnSair').addEventListener('click', sair);
$('btnSairM').addEventListener('click', sair);
$('abas').addEventListener('click', (e) => { const b = e.target.closest('button[data-aba]'); if (b) irPara(b.dataset.aba); });
(async function partida() {
  const s = lerSessaoGuardada();
  if (s && s.refresh) { E.sessao = s; if (await renovar()) { await iniciarApp(); return; } }
  mostrarLogin();
})();
if (typeof module !== 'undefined') module.exports = { faixaDias, agruparBacklog, juntarNaoRecebidos, textoFechamento, situacaoRotas, limparLocais, esc, hojeSP, somarDias, periodo, agregar, totais, porHora, paraCsv, csvCelula, eFiltroSeguro };
