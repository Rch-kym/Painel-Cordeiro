<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />
<title>Painel Cordeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />
<style>
/* ---------- Cores e tipografia ----------
   Marca: azul-marinho e âmbar (a faixa tracejada de estrada).
   Claro: papel azulado, tinta marinho. Escuro: asfalto. O âmbar é só sinal. */
:root {
  --fundo:#F5F6F8; --superficie:#FFFFFF; --superficie-2:#F9FAFB; --tinta:#101828; --tinta-2:#667085; --linha:#E4E7EC;
  --ambar:#E8A33D; --ambar-texto:#7C5008; --asfalto:#12283C; --asfalto-linha:rgba(255,255,255,.30);
  --azul:#1F5AA0; --azul-fundo:#E4EDF8;
  --erro:#A92B1F; --erro-fundo:#F9E6E2; --alerta:#A04F0B; --alerta-fundo:#FBEFD9; --ok:#1B6E44; --ok-fundo:#E4F1E7; --barra:#0F2A43;
  --lateral:#0C1E31; --lateral-tinta:#A9B8C8; --sombra:0 1px 2px rgba(16,24,40,.04);
  --foco:#1F5AA0;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fundo:#07121D; --superficie:#0E2031; --superficie-2:#0A1927; --tinta:#E8EEF5; --tinta-2:#9AAEC2; --linha:#1E3850;
    --ambar:#F0AE45; --ambar-texto:#F0AE45; --asfalto:#040B12; --asfalto-linha:rgba(255,255,255,.22);
    --azul:#86B8EE; --azul-fundo:#12304D;
    --erro:#FF9A8C; --erro-fundo:#3A1A18; --alerta:#F0AE45; --alerta-fundo:#3A2A0E; --ok:#5CCB93; --ok-fundo:#10332A;
    --lateral:#0A1827; --lateral-tinta:#9AAEC2; --sombra:none; --foco:#86B8EE; --barra:#86B8EE;
  }
}
:root[data-tema="escuro"] {
  --fundo:#07121D; --superficie:#0E2031; --superficie-2:#0A1927; --tinta:#E8EEF5; --tinta-2:#9AAEC2; --linha:#1E3850;
  --ambar:#F0AE45; --ambar-texto:#F0AE45; --asfalto:#040B12; --asfalto-linha:rgba(255,255,255,.22);
  --azul:#86B8EE; --azul-fundo:#12304D;
  --erro:#FF9A8C; --erro-fundo:#3A1A18; --alerta:#F0AE45; --alerta-fundo:#3A2A0E; --ok:#5CCB93; --ok-fundo:#10332A;
  --lateral:#0A1827; --lateral-tinta:#9AAEC2; --sombra:none; --foco:#86B8EE; --barra:#86B8EE;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--fundo); color:var(--tinta); font-family:var(--f); font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums; }
[hidden] { display:none !important; }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--foco); outline-offset:2px; border-radius:6px; }
h1, h2, h3 { margin:0; }
.sub { color:var(--tinta-2); font-size:13px; }
.larga { font-stretch:112%; }

/* ---------- Estrutura ---------- */
.shell { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
.lateral { background:var(--lateral); color:#F2F6FA; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:22px 14px 0; }
.marca { padding:0 8px 26px; display:flex; align-items:center; gap:11px; }
.marca img { border-radius:10px; flex:none; }
.marca b { display:block; font-size:19px; font-weight:900; font-stretch:112%; letter-spacing:.5px; line-height:1; }
.marca small { display:block; margin-top:5px; font-size:10px; letter-spacing:3.2px; color:var(--lateral-tinta); }
.faixa { height:4px; width:56px; margin-top:12px; background:repeating-linear-gradient(90deg,var(--ambar) 0 12px,transparent 12px 20px); border-radius:2px; }
#abas { display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
#abas button { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; color:var(--lateral-tinta); padding:10px 10px; border-radius:10px; cursor:pointer; font-weight:600; font-size:14.5px; position:relative; }
#abas button svg { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#abas button:hover { background:rgba(255,255,255,.07); color:#fff; }
#abas button[aria-current="page"] { background:var(--ambar); color:#0F2A43; font-weight:800; }

.nome-curto { display:none; }
.lateral-pe { border-top:1px solid rgba(255,255,255,.12); padding:14px 6px 18px; display:flex; flex-direction:column; gap:10px; }
.eu { display:flex; align-items:center; gap:10px; min-width:0; }
.eu .av { background:rgba(255,255,255,.14); color:#fff; }
.eu div { min-width:0; line-height:1.2; }
.eu b { display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.eu span { font-size:12px; color:var(--lateral-tinta); }
.pe-botoes { display:flex; gap:8px; }
.btn-lat { flex:1; background:transparent; border:1px solid rgba(255,255,255,.22); color:#E4ECF4; border-radius:9px; padding:7px 8px; font-size:13px; font-weight:700; cursor:pointer; }
.btn-lat:hover { border-color:var(--ambar); }
.coluna { min-width:0; }
.topo-m { display:none; }
main { max-width:1120px; margin:0 auto; padding:30px 28px 80px; }

/* ---------- Cabeçalho de página ---------- */
.pagina-topo { display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:22px; }
.pagina-topo h1 { font-size:clamp(26px,3.2vw,36px); font-weight:850; font-stretch:114%; letter-spacing:-.6px; line-height:1.08; }
.pagina-topo p { margin:6px 0 0; color:var(--tinta-2); font-size:14.5px; max-width:62ch; }
.acoes { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

/* ---------- Controles ---------- */
.seg { max-width:100%; overflow-x:auto; display:inline-flex; background:var(--superficie); border:1px solid var(--linha); border-radius:11px; padding:3px; gap:2px; flex-wrap:wrap; }
.seg button { white-space:nowrap; flex:none; border:0; background:none; padding:7px 13px; border-radius:8px; font-weight:700; font-size:13.5px; color:var(--tinta-2); cursor:pointer; }
.seg button:hover { color:var(--tinta); }
.seg button[aria-pressed="true"] { background:var(--tinta); color:var(--superficie); }
label.c { display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:700; color:var(--tinta-2); }
label.c input, label.c select { font-weight:500; color:var(--tinta); }
input, select, textarea { padding:9px 11px; border:1px solid var(--linha); border-radius:9px; background:var(--superficie); font-size:14.5px; min-height:40px; }
input:disabled { background:transparent; border-color:transparent; padding-left:0; }
input::placeholder { color:var(--tinta-2); opacity:.7; }
.btn { cursor:pointer; font-weight:750; border-radius:10px; border:1px solid var(--linha); padding:9px 15px; background:var(--superficie); font-size:14px; min-height:40px; transition:border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color:var(--tinta); }
.btn.main { background:var(--lateral); color:#fff; border-color:var(--lateral); }
.btn.main:hover:not(:disabled) { border-color:var(--ambar); }
.btn.ambar { background:var(--ambar); color:#0F2A43; border-color:var(--ambar); }
.btn.mini { padding:4px 11px; font-size:13px; min-height:32px; }
.btn:disabled { opacity:.55; cursor:default; }
.filtros { display:flex; gap:12px 16px; flex-wrap:wrap; align-items:flex-end; }
.busca-in { position:relative; display:block; }
.busca-in svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:17px; height:17px; stroke:var(--tinta-2); fill:none; stroke-width:2; stroke-linecap:round; }
.busca-in input { padding-left:36px; min-width:260px; width:100%; }

/* ---------- Superfícies ---------- */
.cartao { background:var(--superficie); border:1px solid var(--linha); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:var(--sombra); }
.cartao h2 { font-size:17px; font-weight:800; font-stretch:106%; letter-spacing:-.2px; }
.cartao-topo { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.aviso { padding:11px 14px; border-radius:11px; background:var(--alerta-fundo); color:var(--alerta); font-size:14px; margin-bottom:14px; font-weight:600; }
.aviso.erro { background:var(--erro-fundo); color:var(--erro); }
.vazio { padding:26px 6px; color:var(--tinta-2); text-align:center; max-width:52ch; margin:0 auto; }
.vazio b { display:block; color:var(--tinta); font-size:16px; margin-bottom:4px; }

/* ---------- Produtividade: resumo ---------- */
.cards { display:grid; grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:16px; }
.total { background:var(--tinta); color:var(--superficie); border-radius:16px; padding:20px 22px; display:flex; flex-direction:column; gap:12px; }
.total h2 { font-size:14px; font-weight:700; opacity:.82; font-stretch:100%; letter-spacing:0; }
.total-n { font-size:clamp(46px,6vw,68px); font-weight:900; font-stretch:122%; line-height:.95; letter-spacing:-2px; }
.divide { display:flex; height:10px; border-radius:6px; overflow:hidden; gap:3px; }
.divide i { display:block; min-width:4px; }
.divide .d-ch { background:#86B8EE; } .divide .d-at { background:var(--ambar); }
.legenda { display:flex; gap:18px; font-size:13.5px; flex-wrap:wrap; }
.legenda span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px; vertical-align:-1px; }
.legenda .l-ch::before { background:#86B8EE; } .legenda .l-at::before { background:var(--ambar); }
.legenda b { font-weight:800; }
.prob { justify-content:space-between; text-align:left; border:1px solid var(--linha); background:var(--superficie); border-radius:16px; padding:18px 18px 14px; cursor:pointer; display:flex; flex-direction:column; gap:3px; box-shadow:var(--sombra); transition:border-color .15s, transform .15s; }
.prob:hover { border-color:currentColor; }
.prob b { font-size:38px; font-weight:850; font-stretch:114%; line-height:1; letter-spacing:-1px; }
.prob span { font-size:14.5px; font-weight:700; color:var(--tinta); }
.prob small { font-size:12.5px; color:var(--tinta-2); margin-top:4px; }
.prob.zero b { color:var(--tinta-2); font-weight:700; }
.prob.erro { color:var(--erro); } .prob.diverg { color:var(--alerta); } .prob.rep { color:var(--azul); }
.prob.zero { color:var(--tinta-2); }

/* ---------- Produtividade: pistas (ranking) ---------- */
.pistas { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.pista { display:grid; grid-template-columns:26px 38px minmax(0,1fr) 92px; gap:4px 14px; align-items:center; padding:13px 0; border-top:1px solid var(--linha); }
.pista:first-child { border-top:0; }
.pos { color:var(--tinta-2); font-weight:700; text-align:center; }
.av { width:38px; height:38px; border-radius:50%; background:var(--azul-fundo); color:var(--azul); display:grid; place-items:center; font-weight:800; font-size:13px; letter-spacing:.3px; flex:none; }
.pista-topo { display:flex; gap:4px 12px; align-items:baseline; flex-wrap:wrap; margin-bottom:7px; }
.pista-topo b { font-size:15.5px; font-weight:800; }
.pista-topo .sub { font-size:12.5px; }
.via { position:relative; height:14px; border-radius:7px; background:var(--asfalto); }
.via::before { content:""; position:absolute; left:6px; right:6px; top:50%; height:2px; margin-top:-1px; background:repeating-linear-gradient(90deg,var(--asfalto-linha) 0 9px,transparent 9px 18px); }
.via-fill { position:absolute; left:0; top:0; bottom:0; width:var(--w); background:var(--ambar); border-radius:7px; transform-origin:left center; animation:encher .8s cubic-bezier(.2,.7,.2,1) both; }
.via-fill::after { content:""; position:absolute; left:6px; right:6px; top:50%; height:2px; margin-top:-1px; background:repeating-linear-gradient(90deg,rgba(15,42,67,.45) 0 9px,transparent 9px 18px); }
.meta-marca { position:absolute; top:-5px; bottom:-5px; width:3px; margin-left:-1.5px; background:var(--tinta); border-radius:2px; }
.pista-n { text-align:right; line-height:1.1; }
.pista-n b { font-size:25px; font-weight:850; font-stretch:112%; letter-spacing:-.5px; }
.pista-n .sub { display:block; font-size:12px; }
.pista-extra { grid-column:3 / 5; display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.pista-extra:empty { display:none; }
.etq { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:12.5px; font-weight:750; white-space:nowrap; }
.etq.erro { background:var(--erro-fundo); color:var(--erro); }
.etq.divergencia { background:var(--alerta-fundo); color:var(--alerta); }
.etq.repetido { background:var(--azul-fundo); color:var(--azul); }
.etq.chegada, .etq.atribuicao, .etq.resolvida, .etq.ok { background:var(--ok-fundo); color:var(--ok); }
.etq.aberta { background:var(--alerta-fundo); color:var(--alerta); }
.etq.prometida { background:var(--azul-fundo); color:var(--azul); }
.etq.sem_resposta { background:var(--erro-fundo); color:var(--erro); }
.etq.neutro { background:var(--superficie-2); color:var(--tinta-2); border:1px solid var(--linha); }
@keyframes encher { from { transform:scaleX(0); } to { transform:scaleX(1); } }
.nota-pistas { margin:12px 0 0; display:flex; gap:8px 20px; flex-wrap:wrap; }

/* ---------- Rotas de hoje ---------- */
.rotas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
.rota-cartao { background:var(--superficie); border:1px solid var(--linha); border-radius:16px; padding:16px 18px; box-shadow:var(--sombra); border-left:5px solid var(--ambar); }
.rota-cartao.feita { border-left-color:var(--ok); }
.rota-cartao h3 { font-size:20px; font-weight:850; font-stretch:112%; letter-spacing:-.3px; display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.rota-cartao h3 svg { width:20px; height:20px; stroke:var(--ambar-texto); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.rota-cartao.feita h3 svg { stroke:var(--ok); }
.rota-pessoa { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--linha); }
.rota-pessoa .av { width:30px; height:30px; font-size:11.5px; }
.rota-pessoa b { font-size:14.5px; }
.rota-pessoa .sub { display:block; font-size:12.5px; }
.resumo-rotas { display:flex; gap:10px 14px; flex-wrap:wrap; margin-bottom:16px; }

/* ---------- Ritmo do dia ---------- */
.ritmo { display:flex; align-items:flex-end; gap:5px; height:150px; padding-top:4px; }
.ritmo > div { box-sizing:border-box; padding-top:18px; flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; position:relative; }
.ritmo i { display:block; width:100%; border-radius:5px 5px 2px 2px; background:var(--barra); min-height:3px; }
.ritmo .pico i { background:var(--ambar); }
.ritmo em { font-style:normal; font-size:12px; font-weight:800; position:absolute; top:-1px; }
.ritmo span { font-size:11.5px; color:var(--tinta-2); height:14px; }

/* ---------- Tabelas ---------- */
.rolagem { overflow-x:auto; }
.tabela { width:100%; border-collapse:collapse; font-size:14.5px; }
.tabela th { text-align:left; font-size:12.5px; color:var(--tinta-2); font-weight:750; padding:9px 10px; border-bottom:1px solid var(--linha); white-space:nowrap; position:sticky; top:0; background:var(--superficie); }
.tabela td { padding:11px 10px; border-bottom:1px solid var(--linha); vertical-align:top; }
.tabela td.n, .tabela th.n { text-align:right; }
.tabela tbody tr:hover td { background:var(--superficie-2); }
.tabela tr.vencida td:first-child { box-shadow:inset 3px 0 0 var(--erro); }
.tabela .inativa td:first-child { box-shadow:inset 3px 0 0 var(--ambar); }
a.awb { color:var(--azul); cursor:pointer; font-weight:750; text-decoration:underline; text-underline-offset:3px; }
details.det { margin-top:14px; }
details.det summary { cursor:pointer; font-weight:750; color:var(--azul); padding:6px 0; }

/* ---------- Pacote (linha do tempo) ---------- */
.pacote-busca { display:flex; gap:10px; flex-wrap:wrap; }
.pacote-busca input { flex:1; min-width:240px; font-size:16px; min-height:46px; }
.pacote-busca .btn { min-height:46px; }
.linha-tempo { list-style:none; margin:6px 0 0; padding:0 0 0 8px; position:relative; }
.linha-tempo::before { content:""; position:absolute; left:15px; top:10px; bottom:10px; width:2px; background:var(--linha); }
.linha-tempo li { display:grid; grid-template-columns:16px minmax(0,1fr); gap:14px; padding:10px 0; position:relative; }
.linha-tempo li > i { width:16px; height:16px; border-radius:50%; background:var(--superficie); border:3px solid var(--azul); margin-top:3px; position:relative; z-index:1; }
.linha-tempo li.t-erro > i { border-color:var(--erro); } .linha-tempo li.t-divergencia > i { border-color:var(--ambar); }
.linha-tempo li.t-ok > i { border-color:var(--ok); }
.linha-tempo time { display:block; color:var(--tinta-2); font-size:13px; margin-bottom:3px; }

/* ---------- Toast ---------- */
#toasts { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast { background:var(--tinta); color:var(--superficie); padding:11px 16px; border-radius:11px; font-weight:700; font-size:14px; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); animation:entra .25s ease-out; max-width:340px; }
.toast.erro { background:var(--erro); color:#fff; }
@keyframes entra { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

/* ---------- Esqueleto de carregamento ---------- */
.esq { border-radius:12px; background:linear-gradient(90deg,var(--linha) 0%,var(--superficie-2) 50%,var(--linha) 100%); background-size:200% 100%; animation:brilho 1.3s linear infinite; }
@keyframes brilho { to { background-position:-200% 0; } }

/* ---------- Entrar ---------- */
.entrar { position:fixed; inset:0; overflow:hidden; color:#F2F6FA; background:radial-gradient(ellipse at 50% 40%,#16385A 0%,#0B1D30 55%,#060F19 100%); }
.entrar[hidden] { display:none; }
.ent-gigante { position:absolute; left:2%; right:2%; top:11%; pointer-events:none; }
.ent-gigante svg { width:100%; height:auto; display:block; }
.mapa { position:absolute; inset:0; color:rgba(255,255,255,.04); transform:scale(.8) translateY(-13%); }
.ent-sombra { position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(4,10,18,.8)); pointer-events:none; }
.ent-topo { position:absolute; top:34px; left:44px; right:44px; display:flex; justify-content:space-between; align-items:center; gap:16px; z-index:3; }
.ent-logo { width:46px; height:46px; border-radius:13px; box-shadow:0 0 0 1px rgba(255,255,255,.12); flex:none; }
.ent-topo span { font-size:13px; font-weight:700; color:rgba(245,242,236,.65); letter-spacing:.4px; text-align:right; }
.ent-chamada { position:absolute; left:0; right:0; top:57%; text-align:center; z-index:3; pointer-events:none; }
.ent-chamada b { font-size:clamp(13px,1.5vw,18px); font-weight:800; letter-spacing:7px; padding-left:7px; color:var(--ambar); }
.ent-barra { position:absolute; left:50%; bottom:92px; transform:translateX(-50%); width:min(880px,86%); display:flex; gap:10px; padding:10px; border-radius:22px; z-index:3; align-items:center; background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04)); -webkit-backdrop-filter:blur(26px) saturate(1.2); backdrop-filter:blur(26px) saturate(1.2); border:1px solid rgba(255,255,255,.18); box-shadow:0 30px 80px rgba(0,0,0,.4); }
.ent-barra .aviso { position:absolute; left:10px; right:10px; bottom:calc(100% + 10px); margin:0; }
.ent-campo { flex:1; min-width:0; display:block; position:relative; height:52px; background:rgba(255,255,255,.08); border-radius:14px; border:1px solid rgba(255,255,255,.10); }
.ent-campo:focus-within { border-color:var(--ambar); box-shadow:0 0 0 3px rgba(232,163,61,.25); }
.ent-campo > span:first-child { position:absolute; left:14px; top:7px; font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:rgba(245,242,236,.55); }
.ent-campo input { width:100%; height:100%; box-sizing:border-box; background:transparent; border:0; outline:0; color:#fff; font:inherit; font-size:15px; padding:22px 14px 6px; }

.ativo:hover { border-color:var(--tinta-2); } .ativo.sel { border-color:var(--alerta); box-shadow:0 0 0 1px var(--alerta); }
.ativo .t { display:flex; align-items:center; gap:8px; min-width:0; } .ativo .t > b { flex:1 1 auto; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .ativo .t .lock, .ativo .t .av { flex:none; } .ativo .t .n { flex:none; margin-left:auto; font-weight:850; font-size:22px; font-variant-numeric:tabular-nums; }
.barra-s { height:8px; border-radius:5px; background:var(--superficie-2); overflow:hidden; } .barra-s i { display:block; height:100%; background:var(--alerta); border-radius:5px; } .barra-s.par i { background:var(--erro); }
.pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:800; white-space:nowrap; }
.pill i { width:7px; height:7px; border-radius:50%; background:currentColor; }
.pill.andamento { background:var(--alerta-fundo); color:var(--alerta); } .pill.fechada { background:var(--ok-fundo); color:var(--ok); } .pill.parada { background:var(--erro-fundo); color:var(--erro); }
.sac-grade { display:grid; grid-template-columns:minmax(0,2fr) minmax(300px,.85fr); gap:16px; align-items:start; }
.sac-grade .tabela td, .sac-grade .tabela th { padding-left:7px; padding-right:7px; } .sac-grade .tabela td:first-child { min-width:150px; } .sac-grade .tabela td:nth-child(2) { max-width:150px; }
.sac-grade .tabela td[data-r="Último bipe"] { white-space:nowrap; }
@media (max-width:1280px) { .sac-grade { grid-template-columns:1fr; } .gaveta { position:static; } }
.gaveta { position:sticky; top:12px; }
tr.clic { cursor:pointer; } tr.clic:hover td { background:var(--superficie-2); } tr.clic.sel td { background:var(--superficie-2); }
.pk-lista { display:flex; flex-direction:column; gap:6px; max-height:360px; overflow:auto; margin-top:8px; }
.pk { display:grid; grid-template-columns:48px 1fr auto; gap:10px; align-items:center; padding:9px 10px; border:1px solid var(--linha); border-radius:9px; background:var(--superficie-2); cursor:pointer; width:100%; text-align:left; color:var(--tinta); }
.pk:hover { border-color:var(--tinta-2); } .pk time { font-size:12px; color:var(--tinta-2); }
.volta { border:0; background:none; color:var(--azul); font-weight:700; font-size:13px; padding:0; margin-bottom:8px; cursor:pointer; }
.dl { display:grid; grid-template-columns:100px 1fr; gap:6px 10px; font-size:13px; margin:10px 0; } .dl dt { color:var(--tinta-2); } .dl dd { margin:0; font-weight:600; }
/* Meta do dia: 4 cartões, sem sobra no celular */
.tiles4 { grid-template-columns:repeat(4,minmax(0,1fr)); } @media (max-width:900px) { .tiles4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
/* ---- 1.17: nada estoura o cartão (e-mails e nomes longos quebram ou viram …) ---- */
.pista-topo b, .rota-pessoa b, .tile b, .tile span, .tile small { overflow-wrap:anywhere; min-width:0; }
.rota-pessoa > div, .pista > div { min-width:0; }
.tabela td { overflow-wrap:break-word; }
.tabela td.n, .tabela td.num, .tabela td[data-r="Início"], .tabela td[data-r="Duração"], .tabela td[data-r="Status"] { white-space:nowrap; }
/* ---- 1.16: tempos, conciliação, modal ---- */
.tempo { display:flex; border:1px solid var(--linha); border-radius:10px; overflow:hidden; background:var(--superficie-2); margin-top:8px; }
.tempo > div { flex:1; padding:8px 12px; border-right:1px solid var(--linha); min-width:0; }
.tempo > div:last-child { border-right:0; }
.tempo small { display:block; font-size:11px; letter-spacing:.7px; text-transform:uppercase; color:var(--tinta-2); font-weight:800; }
.tempo b { font-size:17px; font-weight:750; letter-spacing:-.3px; }
.tempo.grande b { font-size:24px; }
.tempo .tt { background:var(--alerta-fundo); } .tempo .tt b { color:var(--alerta); }
.cid { border:1px solid var(--linha); border-radius:12px; background:var(--superficie); margin-bottom:10px; overflow:hidden; }
.cid.falta { border-color:var(--alerta); } .cid.ok2 { border-color:var(--ok); }
.cid .cab { display:grid; grid-template-columns:minmax(150px,1.2fr) minmax(0,2fr) auto auto; gap:18px; align-items:center; padding:14px 18px; width:100%; text-align:left; background:none; border:0; color:inherit; font:inherit; cursor:pointer; }
.cid .cab:disabled { cursor:default; }
.cid .cab .nome { font-size:16px; }
.cid .num { display:flex; gap:18px; font-size:12px; color:var(--tinta-2); } .cid .num b { display:block; font-size:18px; color:var(--tinta); }
.barra-c { height:8px; border-radius:5px; background:var(--superficie-2); overflow:hidden; margin-top:8px; } .barra-c i { display:block; height:100%; background:var(--ambar); border-radius:5px; } .barra-c.ok i { background:var(--ok); }
.cid .corpo2 { border-top:1px solid var(--linha); padding:6px 18px 14px; background:var(--superficie-2); }
.cid .chev { color:var(--tinta-2); font-size:18px; width:14px; }
.badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:12.5px; font-weight:800; white-space:nowrap; }
.badge.v { background:var(--ok-fundo); color:var(--ok); } .badge.a { background:var(--alerta-fundo); color:var(--alerta); }
@media (max-width:720px) { .cid .cab { grid-template-columns:1fr auto; gap:8px 10px; padding:12px; } .cid .cab > div:nth-child(2) { grid-column:1 / -1; order:3; } .tempo.grande b { font-size:19px; } }
.modal-fundo { position:fixed; inset:0; background:rgba(4,11,18,.6); display:grid; place-items:center; z-index:200; padding:16px; }
.modal { background:var(--superficie); color:var(--tinta); border:1px solid var(--linha); border-radius:14px; padding:20px 22px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.35); }
.modal h2 { margin:0 0 10px; font-size:18px; } .modal p { margin:0 0 10px; line-height:1.5; }
.modal-acoes { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
.lcRow input { width:100%; min-width:120px; }

<script>
/* ===================== PURAS ===================== */
/* PURAS:INICIO */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function hojeSP(agora) {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(agora || new Date());
  return p; // AAAA-MM-DD
}
function somarDias(iso, n) {
  const [a, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(a, m - 1, d + n));
  return dt.toISOString().slice(0, 10);
}
function periodo(tipo, hoje, de, ate) {
  switch (tipo) {
    case 'hoje': return { de: hoje, ate: hoje };
    case 'ontem': { const o = somarDias(hoje, -1); return { de: o, ate: o }; }
    case '7d': return { de: somarDias(hoje, -6), ate: hoje };
    case '30d': return { de: somarDias(hoje, -29), ate: hoje };
    case 'mes': return { de: hoje.slice(0, 8) + '01', ate: hoje };
    default: return { de: de || hoje, ate: ate || hoje };
  }
}
function dataBR(iso) { const [a, m, d] = String(iso).slice(0, 10).split('-'); return d + '/' + m + '/' + a; }
// linhas da view produtividade_dia -> um item por colaborador
function agregar(linhas) {
  const por = new Map();
  for (const l of linhas) {
    let o = por.get(l.operador_id);
    if (!o) { o = { id: l.operador_id, nome: l.operador, chegada: 0, atribuicao: 0, erro: 0, divergencia: 0, repetido: 0, tot: { chegada: 0, atribuicao: 0, erro: 0, divergencia: 0, repetido: 0 } }; por.set(l.operador_id, o); }
    if (l.tipo in o.tot) { o[l.tipo] += Number(l.pacotes_unicos) || 0; o.tot[l.tipo] += Number(l.total) || 0; }
  }
  const lista = [...por.values()];
  for (const o of lista) {
    o.pacotes = o.chegada + o.atribuicao;
    const tentativas = o.tot.chegada + o.tot.atribuicao + o.tot.erro;
    o.taxaErro = tentativas ? o.tot.erro / tentativas : 0;
  }
  lista.sort((a, b) => b.pacotes - a.pacotes || a.nome.localeCompare(b.nome, 'pt-BR'));
  return lista;
}
function totais(lista) {
  const t = { chegada: 0, atribuicao: 0, erro: 0, divergencia: 0, repetido: 0, pacotes: 0 };
  for (const o of lista) { for (const k of ['chegada', 'atribuicao', 'erro', 'divergencia', 'repetido']) t[k] += o[k]; t.pacotes += o.pacotes; }
  return t;
}
function horaSP(iso) {
  return Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Sao_Paulo', hour: '2-digit', hour12: false }).format(new Date(iso))) % 24;
}
function porHora(eventos) {
  const h = new Array(24).fill(0);
  for (const e of eventos) if (e.tipo === 'chegada' || e.tipo === 'atribuicao') h[horaSP(e.ocorreu_em)] += 1;
  return h;
}
function csvCelula(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // evita fórmula ao abrir no Excel
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function paraCsv(cabecalho, linhas) {
  return '﻿' + [cabecalho, ...linhas].map((l) => l.map(csvCelula).join(';')).join('\r\n');
}
function dataHoraBR(iso) {
  return new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date(iso));
}
function iniciais(nome) {
  const p = String(nome || '').replace(/<[^>]*>/g, '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function dataExtenso(iso) {
  const [a, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  const t = new Intl.DateTimeFormat('pt-BR', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(Date.UTC(a, m - 1, d, 12)));
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function rotuloPeriodo(est, hoje) {
  if (est.de === est.ate) return est.de === hoje ? 'Hoje, ' + dataExtenso(est.de).toLowerCase() : dataExtenso(est.de);
  return dataBR(est.de) + ' a ' + dataBR(est.ate);
}
function pico(h) {
  let b = 0;
  for (let i = 1; i < h.length; i++) if (h[i] > h[b]) b = i;
  return { hora: b, valor: h[b] || 0 };
}
function horaCurta(iso) {
  return new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
}
// Agrupa as linhas de rotas_hoje por rota. Estado: em andamento (alguém sem concluir) ou concluída (todos concluíram).
function situacaoRotas(itens, agora) {
  const por = new Map();
  for (const r of itens || []) { if (!por.has(r.rota)) por.set(r.rota, []); por.get(r.rota).push(r); }
  const lista = [...por.entries()].map(([rota, pessoas]) => {
    const ps = pessoas.map((p) => ({
      id: p.operador_id, nome: p.operador, desde: p.iniciada_em, concluida: !!p.concluida_em, concluidaEm: p.concluida_em || null,
      parado: !p.concluida_em && (agora || Date.now()) - new Date(p.atualizada_em).getTime() > 3 * 3600 * 1000,
    })).sort((a, b) => Number(a.concluida) - Number(b.concluida) || String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    return { rota, pessoas: ps, estado: ps.every((p) => p.concluida) ? 'concluida' : 'andamento' };
  });
  lista.sort((a, b) => (a.estado === b.estado ? 0 : a.estado === 'andamento' ? -1 : 1) || a.rota.localeCompare(b.rota, 'pt-BR', { numeric: true }));
  return lista;
}
function textoFechamento(dia, t, lista, rotas, meta, cobAbertas) {
  const L = [`*Fechamento ${dataBR(dia)}*`, ''];
  L.push(`Pacotes bipados: ${t.pacotes}` + (meta ? ` (meta ${meta})` : ''));
  L.push(`Chegadas: ${t.chegada} · Atribuições: ${t.atribuicao}`);
  L.push(`Erros: ${t.erro} · Divergências: ${t.divergencia} · Repetidos: ${t.repetido}`);
  if (lista.length) { L.push('', '*Por colaborador*'); for (const o of lista) L.push(`• ${o.nome}: ${o.pacotes}` + (o.erro ? ` (${o.erro} erro${o.erro > 1 ? 's' : ''})` : '')); }
  if (rotas.length) { L.push('', '*Rotas*'); for (const r of rotas) L.push(`• ${r.rota} — ${r.nome}: ${r.concluida ? 'concluída' : 'não concluída'}`); }
  if (cobAbertas) L.push('', `Cobranças em aberto: ${cobAbertas}`);
  return L.join('\n');
}
// Backlog: itens da foto = [awb, motorista, codigo, dias, cidade, bairro, erroRota]
function faixaDias(d) { return d >= 11 ? '11+' : d >= 6 ? '6-10' : d >= 3 ? '3-5' : '0-2'; }
function agruparBacklog(itens) {
  const por = new Map();
  for (const x of itens || []) {
    const [awb, mot, cod, dias, cidade, bairro, erro] = x;
    const nome = String(mot || '').trim() || 'Sem motorista (no piso)';
    const k = cod || nome;
    let g = por.get(k);
    if (!g) { g = { chave: k, nome, codigo: cod || '', pacotes: [], maior: 0, tres: 0, dez: 0, erros: 0 }; por.set(k, g); }
    g.pacotes.push({ awb, dias: Number(dias) || 0, cidade: cidade || '', bairro: bairro || '', erro: !!erro });
    g.maior = Math.max(g.maior, Number(dias) || 0);
    if ((Number(dias) || 0) >= 3) g.tres += 1;
    if ((Number(dias) || 0) > 10) g.dez += 1;
    if (erro) g.erros += 1;
  }
  const lista = [...por.values()];
  for (const g of lista) g.pacotes.sort((a, b) => b.dias - a.dias || String(a.awb).localeCompare(String(b.awb)));
  lista.sort((a, b) => b.tres - a.tres || b.pacotes.length - a.pacotes.length || a.nome.localeCompare(b.nome, 'pt-BR'));
  return lista;
}
// Não recebidos: junta a lista com os achados (chave = AWB em maiúsculas).
function juntarNaoRecebidos(itens, achados) {
  const mapa = new Map((achados || []).map((a) => [String(a.chave).toUpperCase(), a]));

function ligarFiltroPeriodo(estado, aoMudar) {

}

function faixa(est) { return `dia=gte.${eFiltroSeguro(est.de)}&dia=lte.${eFiltroSeguro(est.ate)}`; }

    '<button class="btn" id="mtAtualizar" type="button">Atualizar</button>' + (E.perfil.papel === 'dono' ? '<button class="btn main" id="mtLocais" type="button">Editar locais das rotas</button>' : '')) + '<div id="mtCorpo">' + esqueleto() + '</div>';

async function carregarMotoristas(silencioso) {
  const meu = ++tokenMot, hoje = hojeSP(), semana = somarDias(hoje, -6);
  try {
    const [rotas, loc, ev] = await Promise.all([
      api('GET', '/rest/v1/rotas_hoje?select=rota,operador_id,operador,iniciada_em,atualizada_em,concluida_em&order=iniciada_em.asc').catch(() => []),
      api('GET', '/rest/v1/cadastros?select=valor&chave=eq.locais').catch(() => []),
      lerTudo('/rest/v1/eventos?select=tipo,rota,awb,dia&tipo=in.(atribuicao,erro,divergencia)&rota=not.is.null&dia=gte.' + eFiltroSeguro(semana) + '&dia=lte.' + eFiltroSeguro(hoje), 12),
    ]);
    if (meu !== tokenMot || !$('mtCorpo')) return;
    const locais = limparLocais(loc && loc[0] && Array.isArray(loc[0].valor) ? loc[0].valor : []);
    const sr = situacaoRotas(rotas || []), hojeDe = new Map(sr.map((r) => [r.rota, r]));
    const nomes = new Set([...locais.map((l) => l.rota), ...sr.map((r) => r.rota)]);
    const rs = [...nomes].sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }));
    if (!rs.length) { $('mtCorpo').innerHTML = '<div class="cartao"><div class="vazio"><b>Nenhuma rota cadastrada</b>As rotas aparecem aqui quando houver locais cadastrados ou quando alguém escolher a rota do dia no app ou na extensão.</div></div>'; return; }
    if (!rs.includes(E.rotaSel)) E.rotaSel = rs[0];
    const item = (r) => {
      const s = hojeDe.get(r), n = locais.filter((l) => l.rota === r).length;
      const quem = s ? s.pessoas.map((p) => p.nome).join(', ') : 'Livre hoje';
      return `<button type="button" class="rota-item ${r === E.rotaSel ? 'sel' : ''}" data-rota="${esc(r)}"><span><b>${esc(r)}</b><small>${esc(quem)}</small></span><em>${s ? (s.estado === 'concluida' ? ICO_FEITA : ICO_CADEADO) : ''}<i>${n} bairro${n === 1 ? '' : 's'}</i></em></button>`;
    };
    const detalhe = () => {
      const r = E.rotaSel, s = hojeDe.get(r), meus = locais.filter((l) => l.rota === r);
      const linhas = ev.itens.filter((x) => x.rota === r);
      const dist = (tp) => new Set(linhas.filter((x) => x.tipo === tp).map((x) => x.awb)).size;
      const atrib = dist('atribuicao'), err = dist('erro') + dist('divergencia');
      const taxa = atrib + err ? (err / (atrib + err) * 100).toFixed(1).replace('.', ',') + '%' : '—';
      const dias = new Set(linhas.map((x) => x.dia)).size;
      return `<section class="cartao"><div class="cartao-topo"><h2>${esc(r)} · bairros e ruas</h2><span class="sub">Usado na conferência de bipagem</span></div>
        ${meus.length ? `<div class="chips">${meus.map((l) => `<span class="chip">${esc(l.termo)}${l.cidade ? ' <small>' + esc(l.cidade) + '</small>' : ''}</span>`).join('')}</div>` : '<p class="sub">Nenhum local cadastrado para esta rota ainda.</p>'}
        <h3 class="sec">Hoje</h3>
        ${s ? s.pessoas.map((p) => `<div class="rota-pessoa"><span class="av" aria-hidden="true">${esc(iniciais(p.nome))}</span><div><b>${esc(p.nome)}</b><span class="sub">${p.concluida ? 'Concluiu às ' + esc(horaCurta(p.concluidaEm)) : 'Desde ' + esc(horaCurta(p.desde)) + (p.parado ? ' · sem bipe há mais de 3 horas' : '')}</span></div></div>`).join('') : '<p class="sub">Ninguém escolheu esta rota hoje.</p>'}
        <h3 class="sec">Desempenho da semana <span class="sub">(últimos 7 dias)</span></h3>
        <div class="metricas"><div><span>Pacotes atribuídos</span><b>${atrib}</b></div><div><span>Erros e divergências</span><b>${err}</b></div><div><span>Taxa de erro</span><b>${taxa}</b></div><div><span>Dias com bipe</span><b>${dias}</b></div></div>
      </section>`;
    };
    $('mtCorpo').innerHTML = `<div class="grade-rotas"><section class="cartao"><div class="cartao-topo"><h2>Rotas</h2><span class="sub">${rs.length}</span></div><div class="rota-lista">${rs.map(item).join('')}</div></section><div id="mtDet">${detalhe()}</div></div>`;
    $('mtCorpo').querySelectorAll('.rota-item').forEach((b) => b.addEventListener('click', () => {
      E.rotaSel = b.dataset.rota;
      $('mtCorpo').querySelectorAll('.rota-item').forEach((x) => x.classList.toggle('sel', x === b));
      $('mtDet').innerHTML = detalhe();
    }));
  } catch (e) { if (meu === tokenMot && $('mtCorpo') && !silencioso) $('mtCorpo').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }
}

/* ===================== TEMPO REAL ===================== */
// Conexão direta com o Supabase Realtime (WebSocket): quando alguém marca um pacote
// como encontrado, o painel é avisado na hora. Se cair, tenta de novo sozinho; as telas
// continuam atualizando por intervalo como rede de segurança.
const TR = { ws: null, hb: null, rel: null, dep: null, tent: 0, vivo: false, ligado: false, token: '', ref: 1 };
const TOPICO_TR = 'realtime:cordeiro';
function mostrarVivo() {
  const el = $('nrVivo'); if (!el) return;
  el.classList.toggle('on', TR.vivo); el.lastElementChild.textContent = TR.vivo ? 'Ao vivo' : 'Sem tempo real (atualiza a cada 30 s)';
}
function enviarTR(m) { try { if (TR.ws && TR.ws.readyState === 1) TR.ws.send(JSON.stringify(m)); } catch (_) {} }
function pararTempoReal() {
  TR.ligado = false; clearTimeout(TR.rel); clearInterval(TR.hb); clearTimeout(TR.dep);
  const w = TR.ws; TR.ws = null; TR.vivo = false; mostrarVivo();
  try { if (w) { w.onclose = null; w.close(); } } catch (_) {}
}
function iniciarTempoReal() { if (TR.ligado) return; TR.ligado = true; abrirTR(); }
function religarTR() {
  if (!TR.ligado) return; clearTimeout(TR.rel);
  TR.rel = setTimeout(abrirTR, Math.min(60, 2 << Math.min(TR.tent, 5)) * 1000); TR.tent += 1;
}
function caiuTR() {
  clearInterval(TR.hb); const w = TR.ws; TR.ws = null; TR.vivo = false; mostrarVivo();
  try { if (w) { w.onclose = null; w.close(); } } catch (_) {}
  religarTR();
}
function abrirTR() {
  if (!TR.ligado || TR.ws || !E.sessao) return;
  let w;
  try { w = new WebSocket('wss://' + new URL(URL_BASE).host + '/realtime/v1/websocket?apikey=' + encodeURIComponent(CHAVE) + '&vsn=1.0.0'); } catch (_) { religarTR(); return; }
  TR.ws = w;
  w.onopen = () => {
    TR.token = E.sessao ? E.sessao.access : '';
    enviarTR({ topic: TOPICO_TR, event: 'phx_join', ref: '1', join_ref: '1', payload: { config: { broadcast: { ack: false, self: false }, presence: { key: '' }, postgres_changes: [{ event: '*', schema: 'public', table: 'nr_achados' }, { event: '*', schema: 'public', table: 'nr_listas' }, { event: '*', schema: 'public', table: 'sacas' }, { event: '*', schema: 'public', table: 'resolucoes' }, { event: '*', schema: 'public', table: 'eventos' }, { event: '*', schema: 'public', table: 'locais_rota' }] }, access_token: TR.token } });
    clearInterval(TR.hb);
    TR.hb = setInterval(() => {
      enviarTR({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++TR.ref) });
      if (E.sessao && E.sessao.access !== TR.token) { TR.token = E.sessao.access; enviarTR({ topic: TOPICO_TR, event: 'access_token', payload: { access_token: TR.token }, ref: String(++TR.ref) }); }
    }, 25000);
  };
  w.onmessage = (m) => { try { receberTR(JSON.parse(m.data)); } catch (_) {} };
  w.onerror = () => {};
  w.onclose = () => { if (TR.ws === w) caiuTR(); };
}
function receberTR(m) {
  if (!m) return;
  if (m.event === 'phx_reply' && m.topic === TOPICO_TR) {
    if (m.payload && m.payload.status === 'ok') { TR.tent = 0; TR.vivo = true; mostrarVivo(); } else caiuTR();
  } else if (m.event === 'phx_error' || m.event === 'phx_close') caiuTR();
  else if (m.event === 'postgres_changes') {
    const d = m.payload && m.payload.data ? m.payload.data : {};
    if (d.table === 'nr_achados' && d.type === 'INSERT' && d.record && E.aba === 'naorecebidos') aviso('Pacote encontrado: ' + d.record.chave + ' · ' + nomeOperador(d.record.achado_por));
    if (d.table === 'locais_rota' && d.record && E.sessao && d.record.atualizado_por !== E.sessao.id) aviso('Local ' + (d.record.removido ? 'removido' : 'atualizado') + ' por ' + (d.record.por_nome || 'alguém') + ': ' + d.record.termo + ' → ' + d.record.rota);
    clearTimeout(TR.dep); // junta rajadas (vários bipes seguidos) numa atualização só
    const nr = d.table === 'nr_achados' || d.table === 'nr_listas';
    TR.dep = setTimeout(() => {
      if (d.table === 'locais_rota') { if (E.aba === 'locais' && $('lcCorpo')) carregarLocais(true); return; }
      if (E.aba === 'chegada' && $('cheCorpo')) { carregarChegada(true); return; }
      if (E.aba === 'meta' && $('metCorpo') && !document.activeElement.closest('#metForm')) { carregarMeta(true); return; }
      if (nr) { if (E.aba === 'naorecebidos' && $('nrCorpo')) carregarNR(true); return; }
      if (E.aba === 'sacas' && $('sacCorpo')) carregarSacas(true);
      else if (E.aba === 'problemas' && $('prCorpo')) carregarProblemas(true);
      else if (E.aba === 'produtividade' && $('prodCorpo') && estProd.ate === hojeSP()) carregarProdutividade(true);
    }, nr ? 350 : 1200);
  }
}

  const buscar = async () => {
    const awb = eFiltroSeguro($('pkAwb').value.trim());
    const corpo = $('pkCorpo');
    if (!awb) { corpo.innerHTML = ''; return; }
    corpo.innerHTML = esqueleto();
    try {
      const ev = await api('GET', '/rest/v1/eventos?select=id,ocorreu_em,tipo,operador_id,origem,cidade,rota,motorista,motivo&awb=eq.' + awb + '&order=ocorreu_em.asc&limit=500');
      let cob = [];

      if (!ev.length && !cob.length) { corpo.innerHTML = '<div class="cartao"><div class="vazio"><b>Nenhum registro deste pacote</b>Só aparecem pacotes bipados com a Nuvem Cordeiro ligada. Confira o código e tente de novo.</div></div>'; return; }
      const classe = (t) => (t === 'erro' ? 't-erro' : t === 'divergencia' ? 't-divergencia' : t === 'chegada' || t === 'atribuicao' ? 't-ok' : '');
      const itens = [
        ...ev.map((e) => ({ t: e.ocorreu_em, c: classe(e.tipo), html: `<span class="etq ${esc(e.tipo)}">${esc(ROTULO_TIPO[e.tipo] || e.tipo)}</span> <b>${esc(nomeOperador(e.operador_id))}</b> <span class="sub">(${e.origem === 'app' ? 'app' : 'extensão'})</span>${e.motorista ? ' · motorista ' + esc(e.motorista) : ''}${e.rota ? ' · ' + esc(e.rota) : ''}${e.cidade ? ' · ' + esc(e.cidade) : ''}${e.motivo ? '<br><span class="sub">' + esc(e.motivo) + '</span>' : ''}` })),

// Lista única para todos os aparelhos (app e extensão). O administrador edita aqui ou
// no próprio app/extensão; os demais recebem a lista automaticamente.
function limparLocais(lista) {
  const vistos = new Set(), out = [];
  for (const x of lista) {
    const termo = String(x.termo || '').trim().slice(0, 80), rota = String(x.rota || '').trim().slice(0, 60), cidade = String(x.cidade || '').trim().slice(0, 60);
    if (!termo || !rota) continue;
    const k = (termo + '|' + cidade).toLowerCase();
    if (vistos.has(k)) continue;
    vistos.add(k); out.push({ termo, rota, cidade });
  }
  return out;
}
/* ===================== CONFIRMAR ALTERAÇÃO (modal próprio) ===================== */
// Pede confirmação antes de uma alteração que vale para todos. "texto" já vem escapado.
function confirmarAcao(o) {
  return new Promise((resolve) => {
    const f = document.createElement('div');
    f.className = 'modal-fundo'; f.setAttribute('role', 'dialog'); f.setAttribute('aria-modal', 'true');
    f.innerHTML = `<div class="modal"><h2>${esc(o.titulo || 'Tem certeza?')}</h2><p>${o.texto || ''}</p><p class="sub">Alteração de <b id="mdQuem">${esc(o.quem || '')}</b></p>
      <div class="modal-acoes"><button class="btn" data-r="0" type="button">Cancelar</button><button class="btn ambar" data-r="1" type="button">${esc(o.ok || 'Sim, alterar')}</button></div></div>`;
    const tecla = (e) => { if (e.key === 'Escape') fim(false); };
    const fim = (v) => { document.removeEventListener('keydown', tecla); f.remove(); resolve(v); };
    f.addEventListener('click', (e) => { const b = e.target.closest('button[data-r]'); if (b) fim(b.dataset.r === '1'); else if (e.target === f) fim(false); });
    document.addEventListener('keydown', tecla);
    document.body.appendChild(f);
    f.querySelector('[data-r="0"]').focus();
  });
}

async function carregarChegada(silencioso) {

    const [cd, cc, pf] = await Promise.all([
      api('GET', '/rest/v1/chegada_dia?select=dia,pacotes,primeiro_bipe_em,ultimo_bipe_em,pessoas&dia=eq.' + d),
      lerTudo('/rest/v1/conciliacao_cidade?select=dia,cidade,chegaram,atribuidos,faltam,primeira_chegada_em,ultima_chegada_em,concluida_em&dia=eq.' + d + '&order=cidade.asc', 5),
      lerTudo('/rest/v1/conciliacao_pacotes?select=awb,cidade,bairro,endereco,cep,chegou_em,operador_id,operador&atribuido=eq.false&dia=eq.' + d + '&order=chegou_em.asc', 12),
    ]);
    if (meu !== tokenChe || !$('cheCorpo')) return;
    dadosChe = { cd: cd && cd[0] ? cd[0] : null, cc: cc.itens, pend: pf.itens, completo: pf.completo };
    desenharChegada();
  } catch (e) { if (meu === tokenChe && $('cheCorpo') && !silencioso) $('cheCorpo').innerHTML = `<div class="aviso erro">${esc(e.message)} Se for a primeira vez, rode o script 09-chegada-conciliacao-locais.sql no Supabase.</div>`; }

function desenharChegada() {

  const concl = cc.filter((c) => estadoCidadeConc(c) === 'concluida').length, comFalta = cc.length - concl;

        </tbody></table></div>

  $('cheFiltro').addEventListener('click', (e) => { const b = e.target.closest('button[data-f]'); if (b) { estChe.filtro = b.dataset.f; desenharChegada(); } });
  corpo.querySelectorAll('button.cab[data-cid]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.cid; if (estChe.abertas.has(k)) estChe.abertas.delete(k); else estChe.abertas.add(k); desenharChegada(); }));
  corpo.querySelectorAll('[data-todos]').forEach((b) => b.addEventListener('click', () => { estChe.todos.add(b.dataset.todos); desenharChegada(); }));

/* ===================== LOCAIS POR REGRA (tempo real, todos editam) ===================== */
let tokenLoc = 0;
async function telaLocais() {
  $('conteudo').innerHTML = cabecalho('Locais por rota', 'Bairros, ruas ou trechos (como BR-101 ou Centro) que pertencem a cada rota. Qualquer pessoa adiciona ou edita; vale na hora para todos e fica registrado quem alterou. <span class="ao-vivo" id="nrVivo"><i></i><span>Conectando…</span></span>') + `<div id="lcRaiz">${esqueleto()}</div>`;
  mostrarVivo();
  carregarLocais(false);
}
const linhaLocal = (x) => `<tr class="lcRow" data-o="${esc(JSON.stringify({ termo: x.termo, rota: x.rota, cidade: x.cidade || '' }))}"><td><input class="lcTermo" value="${esc(x.termo)}" aria-label="Local" /></td>
  <td><input class="lcRota" list="lcRotas" value="${esc(x.rota)}" aria-label="Rota" /></td>
  <td><input class="lcCidade" value="${esc(x.cidade || '')}" placeholder="Qualquer cidade" aria-label="Cidade" /></td>
  <td class="sub lcPor">${x.por_nome ? 'por ' + esc(x.por_nome) + (x.atualizado_em ? ' · ' + esc(dataHoraBR(x.atualizado_em)) : '') : (x.atualizado_em ? esc(dataHoraBR(x.atualizado_em)) : 'novo')}</td>
  <td class="lcAcoes"><button class="btn mini ambar lcSalvar" type="button">Salvar</button> <button class="btn mini lcDel" type="button">Excluir</button></td></tr>`;
function locaisSujos() {
  return [...document.querySelectorAll('#lcCorpo .lcRow')].some((tr) => {
    const o = tr.dataset.o ? JSON.parse(tr.dataset.o) : null;
    return !o || tr.querySelector('.lcTermo').value !== o.termo || tr.querySelector('.lcRota').value !== o.rota || tr.querySelector('.lcCidade').value !== o.cidade;
  });
}
async function carregarLocais(silencioso) {
  const meu = ++tokenLoc;
  if (silencioso && $('lcCorpo') && locaisSujos()) return; // não apaga o que está sendo digitado
  let lista = [];
  try {
    lista = await api('GET', '/rest/v1/locais_rota?select=chave,termo,rota,cidade,por_nome,atualizado_em&removido=eq.false&order=rota.asc,termo.asc&limit=3000');
  } catch (e) { if ($('lcRaiz') && !silencioso) $('lcRaiz').innerHTML = `<div class="aviso erro">${esc(e.message)} Se for a primeira vez, rode o script 09-chegada-conciliacao-locais.sql no Supabase.</div>`; return; }
  if (meu !== tokenLoc || !$('lcRaiz')) return;
  lista = [...lista].sort((a, b) => String(a.rota).localeCompare(String(b.rota), 'pt-BR', { numeric: true }) || String(a.termo).localeCompare(String(b.termo), 'pt-BR'));
  const rotas = [...new Set(lista.map((x) => x.rota).filter(Boolean))];
  $('lcRaiz').innerHTML = `<div class="cartao">
    <datalist id="lcRotas">${rotas.map((r) => `<option value="${esc(r)}">`).join('')}</datalist>
    <div class="rolagem"><table class="tabela"><thead><tr><th>Local</th><th>Rota</th><th>Cidade</th><th>Última alteração</th><th></th></tr></thead><tbody id="lcCorpo">${lista.map(linhaLocal).join('')}</tbody></table></div>
    ${lista.length ? '' : '<div class="vazio"><b>Nada cadastrado</b>Use "Adicionar local".</div>'}
    <div class="filtros" style="margin-top:14px"><button class="btn" id="lcAdd" type="button">Adicionar local</button><span class="sub">${lista.length} local(is)</span></div></div>`;
  $('lcAdd').addEventListener('click', () => { $('lcCorpo').insertAdjacentHTML('beforeend', linhaLocal({ termo: '', rota: '', cidade: '' }).replace(/ data-o="[^"]*"/, '')); $('lcCorpo').lastElementChild.querySelector('.lcTermo').focus(); });
  $('lcCorpo').addEventListener('click', (ev) => {
    const tr = ev.target.closest('.lcRow'); if (!tr) return;
    if (ev.target.closest('.lcSalvar')) salvarLocal(tr);
    else if (ev.target.closest('.lcDel')) excluirLocal(tr);
  });
}
function lerLinhaLocal(tr) { return { termo: tr.querySelector('.lcTermo').value.trim(), rota: tr.querySelector('.lcRota').value.trim(), cidade: tr.querySelector('.lcCidade').value.trim() }; }
async function gravarLocais(corpo) {
  await api('POST', '/rest/v1/locais_rota?on_conflict=chave', corpo, { Prefer: 'resolution=merge-duplicates,return=minimal' });
}
async function salvarLocal(tr) {
  const novo = lerLinhaLocal(tr), orig = tr.dataset.o ? JSON.parse(tr.dataset.o) : null;
  if (!novo.termo || !novo.rota) { aviso('Preencha o local e a rota.', true); return; }
  if (orig && chaveLocal(orig.termo, orig.cidade) === chaveLocal(novo.termo, novo.cidade) && orig.rota === novo.rota && orig.termo === novo.termo && orig.cidade === novo.cidade) { aviso('Nada mudou.'); return; }
  const texto = `<b>${esc(novo.termo)}</b> → <b>${esc(novo.rota)}</b>${novo.cidade ? ' (' + esc(novo.cidade) + ')' : ' (qualquer cidade)'}.<br>Tem certeza que deseja fazer essa alteração? Ela vale na hora para todos os aparelhos.`;
  if (!(await confirmarAcao({ titulo: orig ? 'Editar local' : 'Adicionar local', texto, quem: E.perfil.nome }))) return;
  const corpo = [];
  if (orig && chaveLocal(orig.termo, orig.cidade) !== chaveLocal(novo.termo, novo.cidade)) corpo.push({ termo: orig.termo, rota: orig.rota, cidade: orig.cidade, removido: true });
  corpo.push({ termo: novo.termo, rota: novo.rota, cidade: novo.cidade, removido: false });
  const b = tr.querySelector('.lcSalvar'); b.disabled = true;
  try { await gravarLocais(corpo); aviso('Local salvo para todos ✓'); await carregarLocais(false); }
  catch (e) { aviso(e.message, true); }
  finally { b.disabled = false; }
}
async function excluirLocal(tr) {
  const orig = tr.dataset.o ? JSON.parse(tr.dataset.o) : null;
  if (!orig) { tr.remove(); return; }
  const texto = `Remover <b>${esc(orig.termo)}</b> (${esc(orig.rota)}).<br>Tem certeza que deseja fazer essa alteração? A regra deixa de valer na hora para todos os aparelhos.`;
  if (!(await confirmarAcao({ titulo: 'Excluir local', texto, quem: E.perfil.nome, ok: 'Sim, excluir' }))) return;
  try { await gravarLocais([{ termo: orig.termo, rota: orig.rota, cidade: orig.cidade, removido: true }]); aviso('Local removido para todos'); await carregarLocais(false); }
  catch (e) { aviso(e.message, true); }
}

// Primeiro bipe, último bipe e tempo de uma saca (cartões das sacas em andamento).
function tempoSaca(x, agora) {
  const t = resumoTempo(x.primeiro_bipe_em || x.aberta_em, x.ultimo_bipe_em || x.aberta_em, agora);
  return `<div class="tempo"><div><small>Início</small><b>${esc(t.inicio)}</b></div><div><small>Último bipe</small><b>${esc(t.fim)}</b></div><div class="tt"><small>Tempo</small><b>${esc(t.total)}</b></div></div>`;
}
function kpiTempoSacas(fechadas) {
  const d = fechadas.filter((x) => x.primeiro_bipe_em && x.ultimo_bipe_em).map((x) => new Date(x.ultimo_bipe_em) - new Date(x.primeiro_bipe_em));
  const med = d.length ? d.reduce((a, v) => a + v, 0) / d.length : null;
  return `<div class="prob zero" style="cursor:default"><b>${med == null ? '—' : esc(duracaoTotal(med))}</b><span>Tempo médio</span><small>${d.length ? 'das ' + d.length + ' fechadas' : 'sem sacas fechadas'}</small></div>`;
}

/* ===================== META DO DIA ===================== */
// Regra: universo = pacotes que chegaram no dia; meta = % do universo (padrão 95%).
// Números vêm do nosso próprio sistema (conciliacao_pacotes). Os campos do DS são
// só conferência. Ajustes manuais ficam na tabela meta_dia (script 10).
const PCT_PADRAO = 95, CORTE_PADRAO = '18:00';
const estMeta = { dia: null };
let tokenMeta = 0, dadosMeta = null, timerMeta = null;
function calcularMeta(cc, cm) {
  const chegaram = cc.reduce((a, c) => a + Number(c.chegaram || 0), 0);
  const atrib = cc.reduce((a, c) => a + Number(c.atribuidos || 0), 0);
  const aj = cm || {};
  const pct = aj.percentual != null && aj.percentual !== '' ? Number(aj.percentual) : PCT_PADRAO;
  const universo = Math.max(0, chegaram + Number(aj.ajuste_universo || 0));
  const atribuidos = Math.max(0, atrib + Number(aj.ajuste_atribuidos || 0));
  const meta = Math.ceil(universo * pct / 100);
  return { chegaram, atrib, pct, universo, atribuidos, meta, faltam: Math.max(0, meta - atribuidos), a_expedir: Math.max(0, universo - atribuidos),
    taxa: universo ? atribuidos / universo * 100 : 0, corte: aj.corte || CORTE_PADRAO };
}
function fmtPct(n) { return n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
function telaMeta() {
  if (!estMeta.dia) estMeta.dia = hojeSP();
  $('conteudo').innerHTML = cabecalho('Meta do dia', 'Atribuir pelo menos ' + PCT_PADRAO + '% do que chegou no dia <span class="ao-vivo" id="nrVivo"><i></i><span>Conectando…</span></span>',
    '<div class="seg" id="metAtalhos"><button type="button" data-d="hoje">Hoje</button><button type="button" data-d="ontem">Ontem</button></div><input type="date" id="metDia" value="' + esc(estMeta.dia) + '" aria-label="Dia" /><button class="btn" id="metAtualizar" type="button">Atualizar</button>') + '<div id="metCorpo">' + esqueleto() + '</div>';
  mostrarVivo();
  $('metDia').addEventListener('change', () => { if ($('metDia').value) { estMeta.dia = $('metDia').value; carregarMeta(false); } });
  $('metAtalhos').addEventListener('click', (e) => { const b = e.target.closest('button[data-d]'); if (!b) return; estMeta.dia = b.dataset.d === 'hoje' ? hojeSP() : somarDias(hojeSP(), -1); $('metDia').value = estMeta.dia; carregarMeta(false); });
  $('metAtualizar').addEventListener('click', () => carregarMeta(false));
  clearInterval(timerMeta);
  timerMeta = setInterval(() => { if (E.aba === 'meta' && !document.hidden && !document.activeElement.closest('#metForm')) carregarMeta(true); }, 30000);
  carregarMeta(false);
}
async function carregarMeta(silencioso) {
  const meu = ++tokenMeta, d = eFiltroSeguro(estMeta.dia);
  try {
    const [cc, pk, cm] = await Promise.all([
      lerTudo('/rest/v1/conciliacao_cidade?select=cidade,chegaram,atribuidos,faltam&dia=eq.' + d, 5),
      lerTudo('/rest/v1/conciliacao_pacotes?select=motorista,atribuido&atribuido=eq.true&dia=eq.' + d, 12),
      api('GET', '/rest/v1/meta_dia?select=*&dia=eq.' + d).catch(() => null),
    ]);
    if (meu !== tokenMeta || !$('metCorpo')) return;
    dadosMeta = { cc: cc.itens, pk: pk.itens, cm: Array.isArray(cm) && cm[0] ? cm[0] : null, semTabela: cm === null };
    desenharMeta();
  } catch (e) { if (meu === tokenMeta && $('metCorpo') && !silencioso) $('metCorpo').innerHTML = `<div class="aviso erro">${esc(e.message)} Se for a primeira vez, rode o script 09 e depois o 10-meta-dia.sql no Supabase.</div>`; }
}
function desenharMeta() {
  const corpo = $('metCorpo'); if (!corpo || !dadosMeta) return;
  const { cc, pk, cm, semTabela } = dadosMeta, r = calcularMeta(cc, cm), gestao = GESTAO.includes(E.perfil.papel);
  const hoje = estMeta.dia === hojeSP();
  const bateu = r.universo > 0 && r.atribuidos >= r.meta;
  const cor = !r.universo ? '' : bateu ? 'ok' : (r.taxa >= r.pct - 15 ? 'alerta' : 'erro');
  // ritmo necessário até o corte (só para o dia de hoje)
  let ritmo = '';
  if (hoje && !bateu && r.universo) {
    const [h, m] = r.corte.split(':').map(Number), ag = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
    const falta = ((h || 0) * 60 + (m || 0)) - (ag.getHours() * 60 + ag.getMinutes());
    ritmo = falta > 0 ? '≈ ' + Math.ceil(r.faltam / (falta / 60)) + ' por hora até as ' + esc(r.corte) : 'passou do horário de corte (' + esc(r.corte) + ')';
  }
  const porMot = new Map();
  for (const p of pk) { const k = (p.motorista || '').trim() || 'Sem motorista'; porMot.set(k, (porMot.get(k) || 0) + 1); }
  const motoristas = [...porMot.entries()].sort((a, b) => b[1] - a[1]);
  const dsAviso = [];
  if (cm && cm.ds_chegada != null && Number(cm.ds_chegada) !== r.chegaram) dsAviso.push(`Chegada: nosso sistema ${r.chegaram} · DS ${cm.ds_chegada} (diferença ${r.chegaram - Number(cm.ds_chegada)})`);
  if (cm && cm.ds_a_expedir != null && Number(cm.ds_a_expedir) !== r.a_expedir) dsAviso.push(`A expedir: nosso sistema ${r.a_expedir} · DS ${cm.ds_a_expedir} (diferença ${r.a_expedir - Number(cm.ds_a_expedir)})`);
  const aj = cm && (Number(cm.ajuste_universo) || Number(cm.ajuste_atribuidos) || cm.percentual != null);
  const tile = (nome, n, sub, c) => `<div class="tile ${c || ''}"><span>${esc(nome)}</span><b>${esc(n)}</b><small>${sub}</small></div>`;
  corpo.innerHTML =
    (semTabela ? '<div class="aviso">A tabela de ajustes ainda não existe: rode o script 10-meta-dia.sql no Supabase. A meta abaixo usa a regra padrão.</div>' : '') +
    (dsAviso.length ? `<div class="aviso">Divergência com o DS — ${dsAviso.map(esc).join(' · ')}</div>` : '') +
    (r.universo ? '' : '<div class="cartao"><div class="vazio"><b>Nenhuma chegada neste dia</b>Quando os pacotes forem bipados no modo Chegada, a meta aparece aqui.</div></div>') +
    (r.universo ? `<div class="tiles tiles4">
      ${tile('Atribuídos', fmtPct(r.taxa), esc(r.atribuidos + ' de ' + r.universo + ' · meta ' + r.pct + '%'), cor)}
      ${tile('Meta em pacotes', r.meta, esc(bateu ? 'meta batida ✓' : 'faltam ' + r.faltam + (ritmo ? ' · ' : '')) + (bateu ? '' : esc(ritmo)), bateu ? 'ok' : '')}
      ${tile('Chegaram', r.universo, aj ? 'com ajuste manual' : 'no dia')}
      ${tile('A expedir', r.a_expedir, 'sem motorista ainda')}
    </div>
    <div class="cartao"><div class="cartao-topo"><h2>Progresso</h2><span class="sub">${esc(fmtPct(r.taxa))} de ${esc(String(r.pct))}% exigidos</span></div>
      <div style="position:relative;height:16px;background:var(--linha);border-radius:9px;overflow:hidden"><div style="height:100%;width:${Math.min(100, r.taxa).toFixed(1)}%;background:var(${bateu ? '--ok' : cor === 'erro' ? '--erro' : '--ambar'})"></div>
      <div style="position:absolute;top:0;bottom:0;left:${Math.min(100, r.pct)}%;width:2px;background:var(--tinta)"></div></div></div>` : '') +
    (motoristas.length ? `<div class="cartao"><div class="cartao-topo"><h2>Atribuídos por motorista</h2><span class="sub">${pk.length} pacote${pk.length === 1 ? '' : 's'}</span></div><div class="rolagem"><table class="tabela"><thead><tr><th>Motorista</th><th class="n">Pacotes</th><th class="n">% do total</th></tr></thead><tbody>
      ${motoristas.map(([n, q]) => `<tr><td><b>${esc(n)}</b></td><td class="n" data-r="Pacotes">${q}</td><td class="n" data-r="% do total">${esc(fmtPct(q / pk.length * 100))}</td></tr>`).join('')}</tbody></table></div></div>` : '') +
    (gestao ? `<div class="cartao" id="metForm"><div class="cartao-topo"><h2>Ajuste manual deste dia</h2><span class="sub">${cm && cm.por_nome ? 'Último ajuste: ' + esc(cm.por_nome) + ' · ' + esc(horaCurta(cm.atualizado_em)) : 'Sem ajustes — vale a regra padrão'}</span></div>
      <div class="filtros">
        <label class="c">Percentual da meta (%)<input id="mfPct" type="number" min="1" max="100" step="0.5" value="${cm && cm.percentual != null ? esc(cm.percentual) : ''}" placeholder="${PCT_PADRAO}" style="width:130px" /></label>
        <label class="c">Ajuste em “chegaram” (+/−)<input id="mfUni" type="number" step="1" value="${cm ? esc(cm.ajuste_universo || 0) : 0}" style="width:130px" /></label>
        <label class="c">Ajuste em “atribuídos” (+/−)<input id="mfAtr" type="number" step="1" value="${cm ? esc(cm.ajuste_atribuidos || 0) : 0}" style="width:130px" /></label>
        <label class="c">Horário de corte<input id="mfCorte" type="time" value="${esc(r.corte)}" style="width:150px" /></label>
      </div>
      <div class="filtros" style="margin-top:10px">
        <label class="c">Chegada no DS (Entregue)<input id="mfDsC" type="number" min="0" value="${cm && cm.ds_chegada != null ? esc(cm.ds_chegada) : ''}" style="width:150px" /></label>
        <label class="c">A expedir no DS<input id="mfDsE" type="number" min="0" value="${cm && cm.ds_a_expedir != null ? esc(cm.ds_a_expedir) : ''}" style="width:150px" /></label>
        <label class="c" style="flex:1;min-width:220px">Motivo / observação<input id="mfNota" type="text" maxlength="200" value="${cm ? esc(cm.nota || '') : ''}" placeholder="Ex.: 30 pacotes de ontem saíram hoje" /></label>
        <button class="btn ambar" id="mfSalvar" type="button">Salvar ajuste</button>${cm ? '<button class="btn" id="mfLimpar" type="button">Voltar ao padrão</button>' : ''}
      </div>
      <p class="sub" style="margin:12px 0 0">Os campos do DS servem só para conferir com o nosso cálculo. Os ajustes ficam registrados com o seu nome.</p></div>` : '');
  if (gestao) {
    const num = (id) => { const v = $(id).value.trim(); return v === '' ? null : Number(v); };
    const gravar = async (corpoReq, msg) => {
      try {
        await api('POST', '/rest/v1/meta_dia?on_conflict=dia', [corpoReq], { Prefer: 'resolution=merge-duplicates,return=minimal' });
        aviso(msg); carregarMeta(false);
      } catch (e) { aviso(e.message + ' (rodou o script 10-meta-dia.sql?)', true); }
    };
    $('mfSalvar').addEventListener('click', () => gravar({
      dia: estMeta.dia, percentual: num('mfPct'), ajuste_universo: Math.trunc(num('mfUni') || 0), ajuste_atribuidos: Math.trunc(num('mfAtr') || 0),
      ds_chegada: num('mfDsC'), ds_a_expedir: num('mfDsE'), corte: $('mfCorte').value || null, nota: $('mfNota').value.trim() || null,
    }, 'Ajuste salvo ✓'));
    const lim = $('mfLimpar');
    if (lim) lim.addEventListener('click', () => gravar({ dia: estMeta.dia, percentual: null, ajuste_universo: 0, ajuste_atribuidos: 0, ds_chegada: null, ds_a_expedir: null, corte: null, nota: null }, 'Voltou à regra padrão'));
  }
}

/* ===================== EQUIPE (administrador) ===================== */
async function telaEquipe() {
  const meta = E.meta && E.meta.pacotes_dia ? E.meta.pacotes_dia : '';
  const lista = [...E.perfis.values()].sort((a, b) => Number(a.ativo) - Number(b.ativo) || a.nome.localeCompare(b.nome, 'pt-BR'));
  const aguardando = lista.filter((p) => !p.ativo).length;
  $('conteudo').innerHTML = cabecalho('Equipe', 'Quem pode entrar e o que cada pessoa vê. Para criar um acesso novo: Supabase › Authentication › Users › Add user. A pessoa aparece aqui como inativa.') +
    (aguardando ? `<div class="aviso">${aguardando} pessoa${aguardando > 1 ? 's' : ''} aguardando ativação.</div>` : '') +
    `<div class="cartao"><div class="rolagem"><table class="tabela"><thead><tr><th>Nome</th><th>Papel</th><th>Ativo</th><th>Nome no iMile</th><th></th></tr></thead><tbody>
    ${lista.map((p) => { const eu = p.id === E.sessao.id; return `<tr data-id="${esc(p.id)}" class="${p.ativo ? '' : 'inativa'}"><td><input class="eqNome" value="${esc(p.nome)}" aria-label="Nome" />${p.ativo ? '' : '<br><span class="etq aberta" style="margin-top:6px">Aguardando ativação</span>'}</td>
      <td><select class="eqPapel" aria-label="Papel" ${eu ? 'disabled' : ''}>${['dono', 'monitor', 'bipador'].map((k) => `<option value="${k}" ${p.papel === k ? 'selected' : ''}>${PAPEL_NOME[k]}</option>`).join('')}</select></td>
      <td><input type="checkbox" class="eqAtivo" aria-label="Ativo" ${p.ativo ? 'checked' : ''} ${eu ? 'disabled' : ''} style="min-height:0;width:20px;height:20px" /></td>
      <td><input class="eqImile" value="${esc(p.nome_imile || '')}" aria-label="Nome no iMile" placeholder="Como aparece no iMile" /></td><td><button class="btn mini eqSalvar" type="button">Salvar</button></td></tr>`; }).join('')}
    </tbody></table></div></div>
    <div class="cartao"><h2 style="margin-bottom:12px">Meta diária</h2><div class="filtros"><label class="c">Pacotes por colaborador por dia<input id="metaDia" type="number" min="0" value="${esc(meta)}" style="width:150px" /></label>
    <button class="btn ambar" id="metaSalvar" type="button">Salvar meta</button></div><p class="sub" style="margin:12px 0 0">Aparece como marca na pista de cada colaborador quando o período é um único dia. Vazio ou 0 desliga.</p></div>`;
  document.querySelectorAll('.eqSalvar').forEach((b) => b.addEventListener('click', async () => {
    const tr = b.closest('tr'), id = tr.dataset.id;
    const dados = { nome: tr.querySelector('.eqNome').value.trim() || 'Sem nome', nome_imile: tr.querySelector('.eqImile').value.trim() || null };
    if (id !== E.sessao.id) { dados.papel = tr.querySelector('.eqPapel').value; dados.ativo = tr.querySelector('.eqAtivo').checked; }
    b.disabled = true;
    try {
      const volta = await api('PATCH', '/rest/v1/perfis?id=eq.' + eFiltroSeguro(id), dados, { Prefer: 'return=representation' });
      if (!Array.isArray(volta) || !volta.length) throw new Error('O banco não aplicou a alteração. Confirme que o script 03-permissoes.sql foi executado e que o seu acesso é de Administrador do banco de dados.');
      E.perfis.set(id, { ...E.perfis.get(id), ...volta[0] });
      aviso(dados.ativo === false ? 'Acesso desativado' : (E.perfis.get(id).ativo && tr.classList.contains('inativa') ? 'Acesso ativado ✓' : 'Alterações salvas'));
      telaEquipe();
    } catch (e) { b.disabled = false; aviso(e.message, true); }
  }));
  $('metaSalvar').addEventListener('click', async () => {
    const n = Math.max(0, Math.floor(Number($('metaDia').value) || 0));
    try {
      await api('POST', '/rest/v1/cadastros', [{ chave: 'metas', valor: { pacotes_dia: n }, atualizado_em: new Date().toISOString() }], { Prefer: 'resolution=merge-duplicates,return=minimal' });
      E.meta = { pacotes_dia: n }; $('metaSalvar').textContent = 'Salvo ✓'; aviso(n ? 'Meta salva: ' + n + ' pacotes por dia' : 'Meta desligada'); setTimeout(() => { $('metaSalvar').textContent = 'Salvar meta'; }, 1200);
    } catch (e) { aviso(e.message, true); }
  });
}

$('lgVer').addEventListener('click', () => { const i = $('lgSenha'), ver = i.type === 'password'; i.type = ver ? 'text' : 'password'; $('lgVer').textContent = ver ? 'Ocultar' : 'Mostrar'; });
$('btnSair').addEventListener('click', sair);
$('btnSairM').addEventListener('click', sair);
$('abas').addEventListener('click', (e) => { const b = e.target.closest('button[data-aba]'); if (b) irPara(b.dataset.aba); });
